    <script>
    // DevBoost 交互逻辑
    (function() {
        "use strict";

        // 主题切换：:root[data-theme] 在 dark / light 之间切换
        window.toggleTheme = function() {
            var root = document.documentElement;
            var cur = root.getAttribute("data-theme") || "dark";
            root.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
        };

        // 显示隐私政策
        window.showPrivacy = function() {
            var content = document.getElementById("resultContent");
            var section = document.getElementById("resultSection");
            if (!content || !section) return;
            
            section.style.display = "block";
            content.innerHTML = `
                <h3>隐私政策</h3>
                <p>我们重视您的隐私安全，以下是我们的隐私政策要点：</p>
                <ol>
                    <li>我们不会存储您的输入数据或生成的解决方案</li>
                    <li>所有数据处理均在您的浏览器中完成</li>
                    <li>我们不会收集您的个人信息或使用记录</li>
                    <li>工具完全免费使用，无需注册或提供个人信息</li>
                    <li>我们不会将您的数据分享给第三方</li>
                </ol>
                <p>如有任何疑问，请联系我们。</p>
            `;
        };

        // 生成解决方案：静态演示实现（无后端 API），输出明确标注的示例方案，非真实 AI 生成
        window.processInput = function() {
            var input = document.getElementById("userInput");
            var section = document.getElementById("resultSection");
            var content = document.getElementById("resultContent");
            var text = (input && input.value || "").trim();
            if (!section || !content) return;
            section.style.display = "block";
            if (!text) {
                content.innerHTML = "<p>请先输入需求或问题描述。</p>";
                return;
            }
            var esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            var brief = esc.length > 120 ? esc.slice(0, 120) + "…" : esc;
            
            // 根据不同输入类型生成相应的解决方案
            var steps = [];
            var codeExample = "";
            
            // 检测输入类型
            if (text.toLowerCase().includes("数组") || text.toLowerCase().includes("array")) {
                steps = [
                    "分析数组结构和需要处理的数据类型",
                    "确定去重或排序的具体需求",
                    "选择合适的方法（如 Set、filter、reduce 等）",
                    "编写函数并测试边界情况",
                    "优化性能，考虑大数组处理"
                ];
                codeExample = `// 数组去重函数
function removeDuplicates(arr) {
  return Array.from(new Set(arr));
}

// 使用示例
const array = [1, 2, 2, 3, 4, 4, 5];
const uniqueArray = removeDuplicates(array);
console.log(uniqueArray); // [1, 2, 3, 4, 5]`;
            } else if (text.toLowerCase().includes("字符串") || text.toLowerCase().includes("string")) {
                steps = [
                    "分析字符串内容和处理需求",
                    "确定是否需要特殊字符处理",
                    "选择合适的方法（如 split、join、正则表达式等）",
                    "编写函数并测试不同输入",
                    "优化性能，考虑长字符串处理"
                ];
                codeExample = `// 字符串反转函数
function reverseString(str) {
  return str.split('').reverse().join('');
}

// 使用示例
const text = "DevBoost";
const reversedText = reverseString(text);
console.log(reversedText); // "tsoBeVD"`;
            } else if (text.toLowerCase().includes("对象") || text.toLowerCase().includes("object")) {
                steps = [
                    "分析对象结构和属性类型",
                    "确定需要处理的属性和方法",
                    "选择深拷贝或浅拷贝方案",
                    "编写函数并处理循环引用",
                    "优化性能，考虑大对象处理"
                ];
                codeExample = `// 深拷贝对象函数
function deepClone(obj) {
  if (obj === null || typeof obj !== 'object') {
    return obj;
  }
  
  if (obj instanceof Date) {
    return new Date(obj);
  }
  
  if (obj instanceof Array) {
    return obj.map(item => deepClone(item));
  }
  
  const cloned = {};
  for (const key in obj) {
    if (obj.hasOwnProperty(key)) {
      cloned[key] = deepClone(obj[key]);
    }
  }
  return cloned;
}`;
            } else if (text.toLowerCase().includes("排序") || text.toLowerCase().includes("sort")) {
                steps = [
                    "分析数据类型和排序需求",
                    "确定排序算法（快速排序、归并排序等）",
                    "实现比较函数或排序逻辑",
                    "编写排序函数并测试不同数据",
                    "优化性能，考虑大数据量处理"
                ];
                codeExample = `// 数组排序函数
function customSort(arr, compareFn) {
  return arr.slice().sort(compareFn);
}

// 使用示例 - 数字排序
const numbers = [3, 1, 4, 1, 5, 9, 2, 6];
const sortedNumbers = customSort(numbers, (a, b) => a - b);
console.log(sortedNumbers); // [1, 1, 2, 3, 4, 5, 6, 9]`;
            } else {
                // 默认通用步骤
                steps = [
                    "明确输入与输出的数据格式，画出最小流程图",
                    "先实现最小可用版本（MVP），跑通主流程",
                    "补充边界处理与错误提示",
                    "写出测试用例验证关键路径",
                    "逐步优化性能与可读性"
                ];
                codeExample = `// 根据需求实现的核心逻辑
function solve(input) {
  // 1. 验证输入
  if (!input || typeof input !== 'expected_type') {
    throw new Error('Invalid input');
  }
  
  // 2. 处理主要逻辑
  const result = processInput(input);
  
  // 3. 返回处理结果
  return result;
}`;
            }
            
            var html = "<p><i>（演示示例 · 非真实 AI 生成）</i></p>";
            html += "<p><b>需求理解：</b>" + brief + "</p>";
            html += "<p><b>建议步骤：</b></p><ol>";
            for (var i = 0; i < steps.length; i++) {
                html += "<li>" + steps[i] + "</li>";
            }
            html += "</ol>";
            html += "<pre><code>" + codeExample + "</code></pre>";
            content.innerHTML = html;
        };

        // 一键复制结果：优先 navigator.clipboard，失败回退 execCommand
        window.copyResult = function() {
            var content = document.getElementById("resultContent");
            var msg = document.getElementById("copyMessage");
            if (!content || !msg) return;
            var text = content.innerText || content.textContent || "";
            function show() {
                msg.classList.add("show");
                setTimeout(function() { msg.classList.remove("show"); }, 1500);
            }
            function fallback() {
                var ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand("copy"); } catch (e) {}
                document.body.removeChild(ta);
                show();
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(show, fallback);
            } else {
                fallback();
            }
        };
    })();
