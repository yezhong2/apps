<body>
    <div class="container">
        <header>
            <h1>Math Challenge Hub</h1>
            <p class="subtitle">Solve, learn, and master mathematical problems</p>
        </header>
        
        <section class="section">
            <h2 class="section-title">Input Math Problem</h2>
            <div class="math-input">
                <textarea id="mathInput" placeholder="Enter your math problem here..."></textarea>
            </div>
            <div class="button-group">
                <button id="solveBtn">Solve</button>
                <button id="similarBtn">Find Similar Problems</button>
                <button id="checkAnswerBtn">Check Answer</button>
                <button id="optimizeBtn">Optimize Solution</button>
            </div>
            <div id="solutionResult" class="result-area" style="display: none;">
                <div class="result-title">Solution</div>
                <div id="solutionContent"></div>
            </div>
            <div id="similarResult" class="result-area" style="display: none;">
                <div class="result-title">Similar Problems</div>
                <div id="similarContent"></div>
            </div>
            <div id="answerResult" class="result-area" style="display: none;">
                <div class="result-title">Answer Check</div>
                <div id="answerContent"></div>
            </div>
            <div id="optimizeResult" class="result-area" style="display: none;">
                <div class="result-title">Optimization Suggestions</div>
                <div id="optimizeContent"></div>
            </div>
        </section>
        
        <section class="section">
            <h2 class="section-title">Solution Process</h2>
            <textarea id="solutionInput" placeholder="Enter your solution process here..."></textarea>
            <div class="button-group">
                <button id="processBtn">Get Feedback</button>
            </div>
            <div id="processResult" class="result-area" style="display: none;">
                <div class="result-title">Process Feedback</div>
                <div id="processContent"></div>
            </div>
        </section>
        
        <section class="section">
            <h2 class="section-title">Difficulty Level</h2>
            <div class="difficulty-selector">
                <button class="difficulty-btn" data-level="beginner">Beginner</button>
                <button class="difficulty-btn" data-level="intermediate">Intermediate</button>
                <button class="difficulty-btn" data-level="advanced">Advanced</button>
                <button class="difficulty-btn" data-level="expert">Expert</button>
            </div>
            <div class="button-group">
                <button id="recommendBtn">Recommend Problems</button>
            </div>
            <div id="recommendResult" class="result-area" style="display: none;">
                <div class="result-title">Recommended Problems</div>
                <div id="recommendContent"></div>
            </div>
        </section>

    <script>
        // Problem types and solutions database
        const mathProblems = {
            beginner: [
                { problem: "2 + 3 × 4", solution: "2 + 12 = 14", explanation: "First multiply 3 by 4, then add 2" },
                { problem: "15 ÷ 3 + 2", solution: "5 + 2 = 7", explanation: "First divide 15 by 3, then add 2" },
                { problem: "5² + 3²", solution: "25 + 9 = 34", explanation: "Calculate squares first, then add" }
            ],
            intermediate: [
                { problem: "√(36 + 64)", solution: "√100 = 10", explanation: "First add inside the square root, then find the square root" },
                { problem: "3x + 5 = 17, find x", solution: "x = 4", explanation: "Subtract 5 from both sides, then divide by 3" },
                { problem: "Factor: x² - 5x + 6", solution: "(x - 2)(x - 3)", explanation: "Find two numbers that multiply to 6 and add to -5" }
            ],
            advanced: [
                { problem: "∫(2x + 3)dx", solution: "x² + 3x + C", explanation: "Integrate each term separately" },
                { problem: "lim(x→∞) (3x² + 2x)/(x² + 1)", solution: "3", explanation: "Divide numerator and denominator by x²" },
                { problem: "Solve: sin²x + cos²x = ?", solution: "1", explanation: "Pythagorean identity" }
            ],
            expert: [
                { problem: "Find the derivative of f(x) = e^(2x) sin(x)", solution: "f'(x) = e^(2x)(2sin(x) + cos(x))", explanation: "Product rule and chain rule" },
                { problem: "Evaluate: ∫(0 to π) sin²(x) dx", solution: "π/2", explanation: "Use trigonometric identity" },
                { problem: "Prove: ∑(n=1 to ∞) 1/n² = π²/6", solution: "Proof involves Fourier series", explanation: "Basel problem solution" }
            ]
        };

        // Initialize difficulty buttons
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Solve button functionality
        document.getElementById('solveBtn').addEventListener('click', function() {
            const input = document.getElementById('mathInput').value.trim();
            if (!input) {
                showSolution("Please enter a math problem");
                return;
            }
            
            // Simple equation parser for demonstration
            let solution = "";
            let explanation = "";
            
            // Basic arithmetic operations
            if (input.includes('+') || input.includes('-') || input.includes('*') || input.includes('/')) {
                try {
                    // Safe evaluation - only allow numbers and basic operations
                    const sanitizedInput = input.replace(/[^0-9+\-*/().\s]/g, '');
                    const result = eval(sanitizedInput);
                    solution = `Result: ${result}`;
                    explanation = `The expression evaluates to ${result}.`;
                } catch (e) {
                    solution = "Unable to solve";
                    explanation = "The expression contains invalid characters or operations.";
                }
            } else if (input.includes('x')) {
                // Simple linear equation
                const match = input.match(/(\d*)x\s*([+-])\s*(\d+)\s*=\s*(\d+)/);
                if (match) {
                    const a = match[1] ? parseInt(match[1]) : 1;
                    const op = match[2];
                    const b = parseInt(match[3]);
                    const c = parseInt(match[4]);
                    
                    if (op === '+') {
                        const x = (c - b) / a;
                        solution = `x = ${x}`;
                        explanation = `Move ${b} to the other side: ${a}x = ${c - b}, then divide by ${a}: x = ${x}`;
                    } else {
                        const x = (c + b) / a;
                        solution = `x = ${x}`;
                        explanation = `Move ${b} to the other side: ${a}x = ${c + b}, then divide by ${a}: x = ${x}`;
                    }
                } else {
                    solution = "Unable to solve";
                    explanation = "Please enter a linear equation in the format: ax + b = c";
                }
            } else {
                solution = "Please enter a valid math problem";
                explanation = "Supported operations: +, -, *, /, and linear equations (e.g., 2x + 3 = 7)";
            }
            
            showSolution(solution, explanation);
        });

        // Find similar problems
        document.getElementById('similarBtn').addEventListener('click', function() {
            const input = document.getElementById('mathInput').value.trim();
            if (!input) {
                showSimilar("Please enter a math problem");
                return;
            }
            
            // Determine difficulty based on input complexity
            let difficulty = "beginner";
            if (input.includes('√') || input.includes('^2')) difficulty = "intermediate";
            if (input.includes('∫') || input.includes('lim') || input.includes('∑')) difficulty = "expert";
            if (input.includes('x') && input.match(/[a-z]/gi)) difficulty = "intermediate";
            
            const similarProblems = mathProblems[difficulty].slice(0, 3);
            let similarContent = `<p>Similar problems at ${difficulty} level:</p><ul>`;
            
            similarProblems.forEach(problem => {
                similarContent += `<li><strong>${problem.problem}</strong> → Solution: ${problem.solution}</li>`;
            });
            
            similarContent += `</ul>`;
            showSimilar(similarContent);
        });

        // Check answer button
        document.getElementById('checkAnswerBtn').addEventListener('click', function() {
            const input = document.getElementById('mathInput').value.trim();
            if (!input) {
                showAnswer("Please enter a math problem");
                return;
            }
            
            // Extract the answer part if it exists (e.g., "x = ?" format)
            let userAnswer = "";
            let isCorrect = false;
            
            if (input.includes('x')) {
                const match = input.match(/x\s*=\s*([^ ]+)/);
                if (match) {
                    userAnswer = match[1].trim();
                    
                    // Solve the equation
                    const equation = input.replace(/\s*x\s*=\s*[^ ]+/, "");
                    try {
                        const sanitizedInput = equation.replace(/[^0-9+\-*/().\s]/g, '');
                        const correctAnswer = eval(sanitizedInput);
                        isCorrect = Math.abs(parseFloat(userAnswer) - correctAnswer) < 0.001;
                    } catch (e) {
                        showAnswer("Unable to verify the answer. Please check your equation format.");
                        return;
                    }
                }
            } else {
                // For direct calculations
                try {
                    const sanitizedInput = input.replace(/[^0-9+\-*/().\s]/g, '');
                    const correctAnswer = eval(sanitizedInput);
                    isCorrect = true;
                    userAnswer = correctAnswer.toString();
                } catch (e) {
                    showAnswer("Unable to verify the answer. Please enter a valid math expression.");
                    return;
                }
            }
            
            const result = isCorrect ? "Correct!" : "Incorrect";
            const message = isCorrect 
                ? "Your answer is correct!"
                : `The correct answer is ${userAnswer}. Please review your solution.`;
            
            showAnswer(result, message);
        });

        // Optimize solution button
        document.getElementById('optimizeBtn').addEventListener('click', function() {
            const input = document.getElementById('mathInput').value.trim();
            if (!input) {
                showOptimization("Please enter a math problem");
                return;
            }
            
            // Basic optimization suggestions based on problem type
            let suggestions = "";
            
            if (input.includes('+') || input.includes('-')) {
                suggestions = `
                    <p><strong>Commutative Property:</strong> You can rearrange terms: a + b = b + a</p>
                    <p><strong>Associative Property:</strong> Grouping doesn't matter: (a + b) + c = a + (b + c)</p>
                `;
            }
            
            if (input.includes('*') || input.includes('/')) {
                suggestions += `
                    <p><strong>Distributive Property:</strong> a × (b + c) = a × b + a × c</p>
                    <p><strong>Division Simplification:</strong> Simplify fractions before multiplying</p>
                `;
            }
            
            if (input.includes('x')) {
                suggestions += `
                    <p><strong>Isolate the Variable:</strong> Move all terms without x to the other side</p>
                    <p><strong>Check Your Solution:</strong> Substitute x back into the original equation</p>
                `;
            }
            
            if (input.includes('^') || input.includes('²')) {
                suggestions += `
                    <p><strong>Exponent Rules:</strong> a^m × a^n = a^(m+n)</p>
                    <p><strong>Factoring:</strong> Look for common factors or patterns</p>
                `;
            }
            
            if (!suggestions) {
                suggestions = "<p>Please enter a mathematical expression to receive optimization suggestions.</p>";
            }
            
            showOptimization(suggestions);
        });

        // Process feedback button
        document.getElementById('processBtn').addEventListener('click', function() {
            const input = document.getElementById('solutionInput').value.trim();
            if (!input) {
                showProcessFeedback("Please enter your solution process");
                return;
            }
            
            // Analyze the solution for common issues
            let feedback = "";
            
            // Check for common mistakes
            if (input.includes('+') && input.includes('*') && !input.includes('(')) {
                feedback += "<p><strong>Parentheses Missing:</strong> Consider using parentheses to clarify order of operations.</p>";
            }
            
            if (input.includes('x') && !input.includes('=')) {
                feedback += "<p><strong>Incomplete Solution:</strong> Your solution doesn't show the final value of x.</p>";
            }
            
            if (input.includes('÷') && !input.includes('/')) {
                feedback += "<p><strong>Division Notation:</strong> Consider using / instead of ÷ for clarity.</p>";
            }
            
            // Check for steps
            if (input.split('\n').length < 2) {
                feedback += "<p><strong>Show Your Steps:</strong> Break down your solution into smaller, clear steps.</p>";
            }
            
            // If no specific issues found, provide general feedback
            if (!feedback) {
                feedback = `
                    <p><strong>Good Structure:</strong> Your solution is well-organized.</p>
                    <p><strong>Improvement Tips:</strong></p>
                    <ul>
                        <li>Double-check each calculation step</li>
                        <li>Verify your final answer by plugging it back into the original problem</li>
                        <li>Consider alternative approaches to confirm your solution</li>
                    </ul>
                `;
            }
            
            showProcessFeedback(feedback);
        });

        // Recommend problems button
        document.getElementById('recommendBtn').addEventListener('click', function() {
            const activeBtn = document.querySelector('.difficulty-btn.active');
            if (!activeBtn) {
                showRecommendation("Please select a difficulty level");
                return;
            }
            
            const difficulty = activeBtn.dataset.level;
            const problems = mathProblems[difficulty];
            
            let recommendation = `<p>Recommended ${difficulty} problems:</p><ul>`;
            
            // Show 3 random problems from the selected difficulty
            const shuffled = [...problems].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 3);
            
            selected.forEach((problem, index) => {
                recommendation += `
                    <li>
                        <strong>Problem ${index + 1}:</strong> ${problem.problem}<br>
                        <em>Solution:</em> ${problem.solution}
                    </li>
                `;
            });
            
            recommendation += `</ul>`;
            showRecommendation(recommendation);
        });

        // Helper functions to display results
        function showSolution(solution, explanation = "") {
            document.getElementById('solutionContent').innerHTML = 
                `<p><strong>Solution:</strong> ${solution}</p>${explanation ? `<p><strong>Explanation:</strong> ${explanation}</p>` : ''}`;
            document.getElementById('solutionResult').style.display = 'block';
            hideOtherResults('solutionResult');
        }

        function showSimilar(content) {
            document.getElementById('similarContent').innerHTML = content;
            document.getElementById('similarResult').style.display = 'block';
            hideOtherResults('similarResult');
        }

        function showAnswer(result, message = "") {
            document.getElementById('answerContent').innerHTML = 
                `<p><strong>Result:</strong> ${result}</p>${message ? `<p>${message}</p>` : ''}`;
            document.getElementById('answerResult').style.display = 'block';
            hideOtherResults('answerResult');
        }

        function showOptimization(content) {
            document.getElementById('optimizeContent').innerHTML = content;
            document.getElementById('optimizeResult').style.display = 'block';
            hideOtherResults('optimizeResult');
        }

        function showProcessFeedback(content) {
            document.getElementById('processContent').innerHTML = content;
            document.getElementById('processResult').style.display = 'block';
            hideOtherResults('processResult');
        }

        function showRecommendation(content) {
            document.getElementById('recommendContent').innerHTML = content;
            document.getElementById('recommendResult').style.display = 'block';
            hideOtherResults('recommendResult');
        }

        function hideOtherResults(activeId) {
            const resultIds = ['solutionResult', 'similarResult', 'answerResult', 'optimizeResult', 'processResult', 'recommendResult'];
            resultIds.forEach(id => {
                if (id !== activeId) {
                    document.getElementById(id).style.display = 'none';
                }
            });
        }
    </script>
