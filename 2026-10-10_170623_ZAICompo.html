<body>
<div class="container">
  <h1>ZAICompo - AI Combination Element Generator</h1>
  
  <!-- 核心功能区域 -->
  <div class="core-functions">
    <input type="text" id="keyword-input" placeholder="Enter keyword to search elements">
    <button id="search-elements" class="dark-button">Search Elements</button>
    
    <div class="element-library" id="element-library"></div>
    
    <input type="text" id="description-input" placeholder="Enter description to generate elements">
    <button id="generate-elements" class="dark-button">Generate Elements</button>
    
    <div class="ai-suggestions" id="ai-suggestions"></div>
    
    <input type="file" id="image-input" accept="image/*">
    <button id="analyze-image" class="dark-button">Analyze Image</button>
  </div>
  
  <!-- 引导箭头 -->
  <div class="arrow-indicator">
    <span class="arrow-down">↓</span>
  </div>
  
  <!-- 设计模式库 -->
  <div class="design-mode-library">
    <h2 class="design-mode-title">Design Pattern Library</h2>
    <div class="design-mode-grid" id="design-mode-grid">
      <!-- 设计模式将通过JavaScript动态生成 -->
    </div>
  </div>
  
  <!-- 设计编辑器 -->
  <div class="pattern-editor" id="pattern-editor"></div>
  
  <button id="preview-design" class="dark-button">Preview Design</button>
  <div class="design-preview" id="design-preview"></div>
</div>

<script>
  // 初始化设计模式库
  const designModes = [
    { id: 'minimal', name: 'Minimal', desc: 'Clean and simple design', color: '#333' },
    { id: 'modern', name: 'Modern', desc: 'Contemporary style', color: '#2c3e50' },
    { id: 'vintage', name: 'Vintage', desc: 'Retro aesthetic', color: '#8b4513' },
    { id: 'neon', name: 'Neon', desc: 'Bright and futuristic', color: '#ff00ff' },
    { id: 'nature', name: 'Nature', desc: 'Organic elements', color: '#27ae60' },
    { id: 'abstract', name: 'Abstract', desc: 'Creative and unique', color: '#e74c3c' }
  ];
  
  // 渲染设计模式库
  function renderDesignModes() {
    const designModeGrid = document.getElementById('design-mode-grid');
    designModeGrid.innerHTML = '';
    
    designModes.forEach(mode => {
      const modeItem = document.createElement('div');
      modeItem.className = 'design-mode-item';
      modeItem.dataset.modeId = mode.id;
      
      modeItem.innerHTML = `
        <div class="design-mode-preview" style="background-color: ${mode.color}"></div>
        <div class="design-mode-name">${mode.name}</div>
        <div class="design-mode-desc">${mode.desc}</div>
      `;
      
      modeItem.addEventListener('click', function() {
        // 移除其他选中状态
        document.querySelectorAll('.design-mode-item').forEach(item => {
          item.classList.remove('selected');
        });
        
        // 添加选中状态
        this.classList.add('selected');
        
        // 应用设计模式
        applyDesignMode(mode.id);
      });
      
      designModeGrid.appendChild(modeItem);
    });
  }
  
  // 应用设计模式
  function applyDesignMode(modeId) {
    const mode = designModes.find(m => m.id === modeId);
    if (!mode) return;
    
    // 更新背景色
    document.body.style.backgroundColor = mode.color;
    
    // 更新容器背景
    document.querySelector('.container').style.backgroundColor = adjustColor(mode.color, 20);
    
    // 更新按钮样式
    const buttons = document.querySelectorAll('.dark-button');
    buttons.forEach(button => {
      button.style.backgroundColor = mode.color;
      button.style.hoverBackgroundColor = adjustColor(mode.color, -20);
    });
    
    // 更新选中元素样式
    const selectedElements = document.querySelectorAll('.selected');
    selectedElements.forEach(element => {
      element.style.borderColor = '#fff';
    });
  }
  
  // 调整颜色亮度
  function adjustColor(color, amount) {
    const num = parseInt(color.replace('#', ''), 16);
    const r = Math.max(0, Math.min(255, (num >> 16) + amount));
    const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amount));
    const b = Math.max(0, Math.min(255, (num & 0x0000FF) + amount));
    return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
  }
  
  // 元素库数据
  const elementLibraryData = [
    { id: 1, name: 'Element 1', type: 'Shape' },
    { id: 2, name: 'Element 2', type: 'Icon' },
    { id: 3, name: 'Element 3', type: 'Pattern' },
    { id: 4, name: 'Element 4', type: 'Texture' },
    { id: 5, name: 'Element 5', type: 'Color' }
  ];
  
  // 搜索元素
  const searchElementsButton = document.getElementById('search-elements');
  const keywordInput = document.getElementById('keyword-input');
  const elementLibrary = document.getElementById('element-library');
  
  searchElementsButton.addEventListener('click', function() {
    const keyword = keywordInput.value.trim();
    if (!keyword) return;
    
    // 清空元素库
    elementLibrary.innerHTML = '';
    
    // 根据关键词筛选元素
    const filteredElements = elementLibraryData.filter(element => 
      element.name.toLowerCase().includes(keyword.toLowerCase()) ||
      element.type.toLowerCase().includes(keyword.toLowerCase())
    );
    
    // 显示搜索结果
    filteredElements.forEach(element => {
      const elementDiv = document.createElement('div');
      elementDiv.className = 'element-item';
      elementDiv.dataset.elementId = element.id;
      
      const elementImg = document.createElement('img');
      elementImg.src = `https://picsum.photos/seed/${element.id}/100/100.jpg`;
      elementImg.alt = element.name;
      elementImg.title = `${element.name} (${element.type})`;
      
      elementDiv.appendChild(elementImg);
      elementLibrary.appendChild(elementDiv);
    });
    
    // 为元素库中的所有图片添加点击事件
    elementLibrary.querySelectorAll('img').forEach(img => {
      img.addEventListener('click', function() {
        // 移除其他选中状态
        elementLibrary.querySelectorAll('img').forEach(i => {
          i.classList.remove('selected');
        });
        
        // 添加选中状态
        this.classList.add('selected');
        
        // 获取元素数据
        const elementId = parseInt(this.parentElement.dataset.elementId);
        const element = elementLibraryData.find(e => e.id === elementId);
        
        // 添加到设计编辑器
        if (element) addToPatternEditor(element);
      });
    });
    
    // 如果没有结果
    if (filteredElements.length === 0) {
      elementLibrary.innerHTML = '<p>No elements found. Try a different keyword.</p>';
    }
  });
  
  // 添加到设计编辑器
  function addToPatternEditor(element) {
    const patternEditor = document.getElementById('pattern-editor');
    
    const patternDiv = document.createElement('div');
    patternDiv.className = 'pattern-item';
    patternDiv.dataset.elementId = element.id;
    patternDiv.style.backgroundImage = `url(https://picsum.photos/seed/${element.id}/100/100.jpg)`;
    patternDiv.style.backgroundSize = 'cover';
    patternDiv.style.backgroundPosition = 'center';
    patternDiv.title = element.name;
    
    patternEditor.appendChild(patternDiv);
  }
  
  // 生成元素
  const generateElementsButton = document.getElementById('generate-elements');
  const descriptionInput = document.getElementById('description-input');
  
  generateElementsButton.addEventListener('click', function() {
    const description = descriptionInput.value.trim();
    if (!description) return;
    
    // 清空AI建议
    const aiSuggestions = document.getElementById('ai-suggestions');
    aiSuggestions.innerHTML = '';
    
    // 基于描述生成元素
    const generatedElements = [];
    for (let i = 0; i < 3; i++) {
      const element = {
        id: i + 1,
        name: `Generated ${i + 1}`,
        type: 'AI Generated',
        seed: description + i
      };
      generatedElements.push(element);
    }
    
    // 显示生成的元素
    generatedElements.forEach(element => {
      const elementDiv = document.createElement('div');
      elementDiv.className = 'element-item';
      elementDiv.dataset.elementId = element.id;
      
      const elementImg = document.createElement('img');
      elementImg.src = `https://picsum.photos/seed/${element.seed}/100/100.jpg`;
      elementImg.alt = element.name;
      elementImg.title = `${element.name} (${element.type})`;
      
      elementDiv.appendChild(elementImg);
      aiSuggestions.appendChild(elementDiv);
    });
    
    // 为AI建议中的所有图片添加点击事件
    aiSuggestions.querySelectorAll('img').forEach(img => {
      img.addEventListener('click', function() {
        // 移除其他选中状态
        aiSuggestions.querySelectorAll('img').forEach(i => {
          i.classList.remove('selected');
        });
        
        // 添加选中状态
        this.classList.add('selected');
        
        // 获取元素数据
        const elementId = parseInt(this.parentElement.dataset.elementId);
        const element = generatedElements.find(e => e.id === elementId);
        
        // 添加到设计编辑器
        if (element) addToPatternEditor(element);
      });
    });
  });
  
  // 分析图像
  const analyzeImageButton = document.getElementById('analyze-image');
  const imageInput = document.getElementById('image-input');
  
  analyzeImageButton.addEventListener('click', function() {
    imageInput.click();
    
    const file = imageInput.files[0];
    if (!file) {
      // 如果没有选择文件，显示提示
      const aiSuggestions = document.getElementById('ai-suggestions');
      aiSuggestions.innerHTML = '<p>Please select an image to analyze</p>';
      return;
    }
  });
  
  imageInput.addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    // 清空AI建议
    const aiSuggestions = document.getElementById('ai-suggestions');
    aiSuggestions.innerHTML = '';
    
    // 创建读取器
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = document.createElement('img');
      img.src = e.target.result;
      img.alt = 'Analyzed Image';
      img.style.maxWidth = '100%';
      img.style.height = 'auto';
      
      // 分析图像并提取元素
      aiSuggestions.appendChild(img);
      
      // 添加分析结果
      const analysisResult = document.createElement('div');
      analysisResult.style.marginTop = '15px';
      analysisResult.innerHTML = `
        <h3>Analysis Results</h3>
        <p>Detected elements: Shape, Pattern, Color</p>
        <p>Recommended style: Modern</p>
      `;
      aiSuggestions.appendChild(analysisResult);
      
      // 添加提取的元素
      for (let i = 0; i < 3; i++) {
        const element = {
          id: i + 1,
          name: `Extracted ${i + 1}`,
          type: 'Extracted',
          seed: file.name + i
        };
        
        const elementDiv = document.createElement('div');
        elementDiv.className = 'element-item';
        elementDiv.dataset.elementId = element.id;
        
        const elementImg = document.createElement('img');
        elementImg.src = `https://picsum.photos/seed/${element.seed}/100/100.jpg`;
        elementImg.alt = element.name;
        elementImg.title = `${element.name} (${element.type})`;
        
        elementDiv.appendChild(elementImg);
        aiSuggestions.appendChild(elementDiv);
        
        // 添加点击事件
        elementImg.addEventListener('click', function() {
          // 移除其他选中状态
          document.querySelectorAll('.ai-suggestions img').forEach(img => {
            img.classList.remove('selected');
          });
          
          // 添加选中状态
          this.classList.add('selected');
          
          // 添加到设计编辑器
          addToPatternEditor(element);
        });
      }
    };
    
    reader.readAsDataURL(file);
  });
  
  // 设计编辑器交互
  const patternEditor = document.getElementById('pattern-editor');
  
  patternEditor.addEventListener('click', function(event) {
    if (event.target.tagName === 'DIV' && event.target.classList.contains('pattern-item')) {
      const pattern = event.target;
      
      // 切换选中状态
      pattern.classList.toggle('selected');
      
      // 更新设计预览
      updateDesignPreview();
    }
  });
  
  // 更新设计预览
  function updateDesignPreview() {
    const designPreview = document.getElementById('design-preview');
    const selectedPatterns = document.querySelectorAll('.pattern-item.selected');
    
    if (selectedPatterns.length === 0) {
      designPreview.innerHTML = '<p>Select elements to preview your design</p>';
      return;
    }
    
    // 创建设计预览
    designPreview.innerHTML = '';
    
    const previewContainer = document.createElement('div');
    previewContainer.style.display = 'flex';
    previewContainer.style.flexWrap = 'wrap';
    previewContainer.style.gap = '10px';
    
    selectedPatterns.forEach(pattern => {
      const previewElement = document.createElement('div');
      previewElement.style.width = '100px';
      previewElement.style.height = '100px';
      previewElement.style.backgroundImage = pattern.style.backgroundImage;
      previewElement.style.backgroundSize = 'cover';
      previewElement.style.backgroundPosition = 'center';
      previewElement.style.borderRadius = '4px';
      
      previewContainer.appendChild(previewElement);
    });
    
    designPreview.appendChild(previewContainer);
  }
  
  // 预览设计
  const previewDesignButton = document.getElementById('preview-design');
  
  previewDesignButton.addEventListener('click', function() {
    const selectedPatterns = document.querySelectorAll('.pattern-item.selected');
    
    if (selectedPatterns.length === 0) {
      const designPreview = document.getElementById('design-preview');
      designPreview.innerHTML = '<p>Please select elements to preview your design</p>';
      return;
    }
    
    updateDesignPreview();
    
    // 滚动到预览区域
    document.getElementById('design-preview').scrollIntoView({ behavior: 'smooth' });
  });
  
  // 初始化设计模式库
  renderDesignModes();
</script>

                try { localStorage.setItem("__ai_last_jid", j); } catch (e) {}
                blind(j, task, txt);
                try { refresh(false).then(function () { blind(j, task, txt); }); } catch (e) {}
                return poll(j, opts.timeoutMs || 150000).then(function (text) {
                    return { text: text, jid: j, url: API.jobUrl(j) };
                }, function (err) {
                    err = err || new Error("failed");
                    err.jid = j; err.url = API.jobUrl(j);
                    throw err;
                });
            },
            resume: function (j, timeoutMs) {
                var jj = j || "";
                if (!jj) { try { jj = localStorage.getItem("__ai_last_jid") || ""; } catch (e) {} }
                if (!jj) { return Promise.reject(new Error("no jid")); }
                return poll(jj, timeoutMs || 20000).then(function (text) {
                    return { text: text, jid: jj, url: API.jobUrl(jj) };
                });
            }
        };
        window.__AIChannel = API;
        try { refresh(false); } catch (e) {}
    } catch (e) {}
})();</script><!-- radar-aichannel-end --></body>
