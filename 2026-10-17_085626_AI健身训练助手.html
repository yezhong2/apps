    <script>
        function generatePlan() {
            const goal = document.getElementById('fitnessGoal').value;
            if (goal) {
                window.__AIChannel.submit('story', { goal: goal }).then(function(r) {
                    document.getElementById('resultContainer').innerText = r.text;
                }).catch(function(e) {
                    document.getElementById('resultContainer').innerText = "Error: " + e.message;
                });
            }
        }

        function watchVideo() {
            const description = document.getElementById('exerciseDescription').value;
            if (description) {
                window.__AIChannel.submit('plot', { description: description }).then(function(r) {
                    const videoContainer = document.getElementById('videoContainer');
                    videoContainer.innerHTML = '<video controls><source src="' + r.url + '" type="video/mp4"></video>';
                }).catch(function(e) {
                    document.getElementById('videoContainer').innerText = "Error: " + e.message;
                });
            }
        }

        function recommendIntensity() {
            const duration = document.getElementById('exerciseDuration').value;
            if (duration) {
                window.__AIChannel.submit('refine', { duration: duration }).then(function(r) {
                    document.getElementById('resultContainer').innerText = r.text;
                }).catch(function(e) {
                    document.getElementById('resultContainer').innerText = "Error: " + e.message;
                });
            }
        }

        function calculateBMR() {
            const height = document.getElementById('height').value;
            const weight = document.getElementById('weight').value;
            if (height && weight) {
                window.__AIChannel.submit('conflict', { height: height, weight: weight }).then(function(r) {
                    document.getElementById('resultContainer').innerText = r.text;
                }).catch(function(e) {
                    document.getElementById('resultContainer').innerText = "Error: " + e.message;
                });
            }
        }

        function getNutritionAdvice() {
            const preference = document.getElementById('dietPreference').value;
            if (preference) {
                window.__AIChannel.submit('dialogue', { preference: preference }).then(function(r) {
                    document.getElementById('nutritionContainer').innerText = r.text;
                }).catch(function(e) {
                    document.getElementById('nutritionContainer').innerText = "Error: " + e.message;
                });
            }
