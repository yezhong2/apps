<script>
// ===== SHEET_CORE_START =====
// 口算小卷 · 纯本地生成核心（无 DOM 依赖；页面渲染与自动化测试共用同一份逻辑）
var SHEET = (function () {
    function rndInt(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
    function pickOne(arr) { return arr[rndInt(0, arr.length - 1)]; }

    var TYPES = [
        { key: "t10", name: "10以内加减法", vs: true },
        { key: "t20", name: "20以内加减法（进位退位）", vs: true },
        { key: "t100", name: "100以内加减法", vs: true },
        { key: "mul", name: "表内乘法", vs: true },
        { key: "div", name: "表内除法", vs: false },
        { key: "muldiv", name: "乘除混合", vs: false },
        { key: "t1000", name: "三位数加减法", vs: true },
        { key: "mix2", name: "两步混合运算", vs: false }
    ];
    function byKey(key) {
        for (var i = 0; i < TYPES.length; i++) { if (TYPES[i].key === key) return TYPES[i]; }
        return TYPES[2];
    }

    function genT10() {
        if (rndInt(0, 1) === 0) {
            var a = rndInt(1, 9), b = rndInt(1, 10 - a);
            return { a: a, b: b, op: "+", ans: a + b, text: a + " + " + b };
        }
        var c = rndInt(3, 10), d = rndInt(1, c - 1);
        return { a: c, b: d, op: "−", ans: c - d, text: c + " − " + d };
    }
    function genT20() {
        for (var t = 0; t < 80; t++) {
            if (rndInt(0, 1) === 0) {
                var a = rndInt(5, 15), b = rndInt(5, 15);
                if (a + b <= 20 && (a % 10 + b % 10) >= 10) return { a: a, b: b, op: "+", ans: a + b, text: a + " + " + b };
            } else {
                var c = rndInt(11, 19), d = rndInt(2, 9);
                if (c % 10 < d && c - d > 0) return { a: c, b: d, op: "−", ans: c - d, text: c + " − " + d };
            }
        }
        var e = rndInt(4, 12), f = rndInt(3, 8);
        return { a: e, b: f, op: "+", ans: e + f, text: e + " + " + f };
    }
    function genT100() {
        if (rndInt(0, 1) === 0) {
            var a = rndInt(11, 89), b = rndInt(11, 100 - a);
            return { a: a, b: b, op: "+", ans: a + b, text: a + " + " + b };
        }
        var c = rndInt(21, 99), d = rndInt(11, c - 1);
        return { a: c, b: d, op: "−", ans: c - d, text: c + " − " + d };
    }
    function genMul() {
        var a = rndInt(2, 9), b = rndInt(2, 9);
        return { a: a, b: b, op: "×", ans: a * b, text: a + " × " + b };
    }
    function genDiv() {
        var q = rndInt(2, 9), d = rndInt(2, 9);
        return { a: q * d, b: d, op: "÷", ans: q, text: (q * d) + " ÷ " + d };
    }
    function genMulDiv() { return rndInt(0, 1) === 0 ? genMul() : genDiv(); }
    function genT1000() {
        if (rndInt(0, 1) === 0) {
            var a = rndInt(101, 898), b = rndInt(101, 999 - a);
            return { a: a, b: b, op: "+", ans: a + b, text: a + " + " + b };
        }
        var c = rndInt(211, 999), d = rndInt(101, c - 1);
        return { a: c, b: d, op: "−", ans: c - d, text: c + " − " + d };
    }
    function genMix2() {
        var form = rndInt(0, 3);
        if (form === 0) {
            var a = rndInt(2, 9), b = rndInt(2, 9), c = rndInt(1, 20);
            return { form: "mulAdd", a: a, b: b, c: c, ans: a * b + c, text: a + " × " + b + " + " + c };
        }
        if (form === 1) {
            var a2 = rndInt(2, 9), b2 = rndInt(2, 9), c2 = rndInt(1, a2 * b2 - 1);
            return { form: "mulSub", a: a2, b: b2, c: c2, ans: a2 * b2 - c2, text: a2 + " × " + b2 + " − " + c2 };
        }
        if (form === 2) {
            var c3 = rndInt(1, 20), a3 = rndInt(2, 9), b3 = rndInt(2, 9);
            return { form: "addMul", a: a3, b: b3, c: c3, ans: c3 + a3 * b3, text: c3 + " + " + a3 + " × " + b3 };
        }
        var c4 = rndInt(30, 99), a4 = rndInt(2, 9);
        var b4 = rndInt(2, Math.min(9, Math.floor((c4 - 1) / a4)));
        return { form: "subMul", a: a4, b: b4, c: c4, ans: c4 - a4 * b4, text: c4 + " − " + a4 + " × " + b4 };
    }

    function one(key) {
        if (key === "t10") return genT10();
        if (key === "t20") return genT20();
        if (key === "t100") return genT100();
        if (key === "mul") return genMul();
        if (key === "div") return genDiv();
        if (key === "muldiv") return genMulDiv();
        if (key === "t1000") return genT1000();
        if (key === "mix2") return genMix2();
        return genT100();
    }
    // 生成一套卷子：同一张卷子内尽量不出重复题（题量大、组合空间小时允许少量重复）
    function genSet(key, n) {
        var out = [], seen = {}, i, t, cand, got;
        for (i = 0; i < n; i++) {
            got = null;
            for (t = 0; t < 40; t++) {
                cand = one(key);
                if (!seen[cand.text]) { got = cand; seen[cand.text] = 1; break; }
            }
            if (!got) got = one(key);
            out.push(got);
        }
        return out;
    }
    return { rndInt: rndInt, pickOne: pickOne, TYPES: TYPES, byKey: byKey, one: one, genSet: genSet };
})();
// ===== SHEET_CORE_END =====

// ===== 页面渲染与交互 =====
(function () {
    function $(id) { return document.getElementById(id); }
    var typeSel = $("typeSel"), countSel = $("countSel"), colSel = $("colSel"),
        vsCheck = $("vsCheck"), vsHint = $("vsHint"), genBtn = $("genBtn"),
        printBtn = $("printBtn"), ansBtn = $("ansBtn"), paper = $("paper"),
        ansPage = $("ansPage"), statusLine = $("statusLine"), toastTip = $("toastTip");

    var ansShown = false, cur = null, toastTimer = null;

    function showToast(msg) {
        if (!toastTip) return;
        toastTip.textContent = msg;
        toastTip.className = "ksj-toast on";
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastTip.className = "ksj-toast"; }, 6000);
    }

    function esc(s) { return String(s); }

    function paperHTML(probs, t, n, vs, cols) {
        var tinfo = SHEET.byKey(t);
        var h = '<div class="paper-head"><div class="paper-title">' + esc(tinfo.name) + ' 练习卷</div><div class="paper-count">共 ' + n + ' 题</div></div>';
        h += '<div class="fill-row"><span><b>姓名：</b><span class="fill"></span></span><span><b>日期：</b><span class="fill"></span></span><span><b>用时：</b><span class="fill s"></span></span><span><b>得分：</b><span class="fill s"></span></span></div>';
        h += '<div class="grid">';
        for (var i = 0; i < probs.length; i++) {
            var p = probs[i], idx = (i + 1) + ".";
            if (vs) {
                h += '<div class="prob vs"><span class="idx">' + idx + '</span><span class="vsbox">'
                   + '<span class="vsline">' + p.a + '</span>'
                   + '<span class="vsline">' + p.op + ' ' + p.b + '</span>'
                   + '<span class="vsrule"></span><span class="vswrite"></span></span></div>';
            } else {
                h += '<div class="prob"><span class="idx">' + idx + '</span><span class="expr">' + p.text + ' =</span><span class="blk"></span></div>';
            }
        }
        h += '</div>';
        return h;
    }
    function ansHTML(probs, t, n) {
        var h = '<div class="ans-head">答案页（' + SHEET.byKey(t).name + ' · 共 ' + n + ' 题）</div><div class="ans-list">';
        for (var i = 0; i < probs.length; i++) {
            h += '<div><span class="ai">' + (i + 1) + '.</span>' + probs[i].ans + '</div>';
        }
        h += '</div><div class="ans-tip">打印时答案自动另起一页；不想要答案页就先点「隐藏答案页」再打印。</div>';
        return h;
    }

    function setVars(t, cols) {
        paper.style.setProperty("--cols", String(cols));
        var wide = (t === "t1000" || t === "mix2");
        paper.style.setProperty("--blkw", wide ? "64px" : "46px");
        paper.style.setProperty("--vsmin", t === "t1000" ? "6.4em" : "5em");
    }

    function hasVs(t) { return !!SHEET.byKey(t).vs; }

    function regenerate() {
        var t = typeSel.value, n = parseInt(countSel.value, 10), cols = parseInt(colSel.value, 10);
        var ok = hasVs(t);
        vsCheck.disabled = !ok;
        if (!ok) vsCheck.checked = false;
        vsHint.textContent = ok ? "（勾选后每题竖排，留白更大）" : "（当前题型不支持竖式）";
        var vs = ok && vsCheck.checked;
        cur = { t: t, n: n, cols: cols, vs: vs, probs: SHEET.genSet(t, n) };
        setVars(t, cols);
        paper.innerHTML = paperHTML(cur.probs, t, n, vs, cols);
        ansPage.innerHTML = ansHTML(cur.probs, t, n);
        ansPage.className = "ans-wrap" + (ansShown ? " on" : "");
        ansBtn.textContent = ansShown ? "隐藏答案页" : "显示答案页";
        statusLine.textContent = "已生成：" + SHEET.byKey(t).name + " · " + n + " 题 · " + cols + " 列 · " + (vs ? "竖式" : "横式");
        saveSettings();
    }

    function saveSettings() {
        try {
            localStorage.setItem("ksj_settings", JSON.stringify({ t: typeSel.value, n: countSel.value, c: colSel.value, v: vsCheck.checked ? 1 : 0 }));
        } catch (e) {}
    }
    function loadSettings() {
        try {
            var j = JSON.parse(localStorage.getItem("ksj_settings") || "");
            if (!j) return;
            if (j.t) typeSel.value = j.t;
            if (j.n) countSel.value = j.n;
            if (j.c) colSel.value = j.c;
            vsCheck.checked = !!j.v;
        } catch (e) {}
    }

    genBtn.addEventListener("click", function () { regenerate(); try { paper.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) {} });
    printBtn.addEventListener("click", function () {
        try { window.print(); } catch (e) {}
        showToast("已调用打印。如果打印窗口没有弹出（部分 App 内置浏览器不支持打印），请点右上角「…」→「在浏览器打开」后再打印。");
    });
    ansBtn.addEventListener("click", function () { ansShown = !ansShown; if (cur) { ansPage.className = "ans-wrap" + (ansShown ? " on" : ""); ansBtn.textContent = ansShown ? "隐藏答案页" : "显示答案页"; } });
    typeSel.addEventListener("change", regenerate);
    countSel.addEventListener("change", regenerate);
    colSel.addEventListener("change", regenerate);
    vsCheck.addEventListener("change", regenerate);

    loadSettings();
    regenerate();
})();
