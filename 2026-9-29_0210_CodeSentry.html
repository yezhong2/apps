<script>
function showPage(page) {
  // 页面切换逻辑
  console.log("切换到页面: " + page);

function analyzeCode() {
  const codeInput = document.getElementById('codeInput').value;
  const result = document.getElementById('result');
  const warnings = document.getElementById('warnings');
  const logs = document.getElementById('logs');
  
  if (!codeInput) {
    result.textContent = "请输入代码进行检测";
    return;
  }
  
  // 模拟代码分析过程
  result.textContent = "正在分析代码...";
  
  setTimeout(() => {
    // 模拟分析结果
    result.textContent = "代码分析完成。共检测到3个潜在问题";
    warnings.innerHTML = `
      <h4>安全警告:</h4>
      <ul>
        <li>第5行: 可能存在SQL注入风险</li>
        <li>第12行: 未经验证的用户输入</li>
        <li>第18行: 敏感信息未加密存储</li>
      </ul>
      <h4>修复建议:</h4>
      <ul>
        <li>使用参数化查询防止SQL注入</li>
        <li>添加输入验证和过滤</li>
        <li>对敏感数据进行加密处理</li>
      </ul>
    `;
    logs.innerHTML = `
      <h4>审查日志:</h4>
      <ul>
        <li>[2026-05-15 10:30:25] 开始代码扫描</li>
        <li>[2026-05-15 10:30:26] 检测到潜在安全漏洞</li>
        <li>[2026-05-15 10:30:27] 生成安全报告</li>
      </ul>
    `;
  }, 1500);
}
</script>
