<script>
(function(){
  try{
    localStorage.setItem("unlocked","1");
    ["lockNotice","unlockSection","unlockForm","unlockContent","unlockActivated","activatedText","activatedMessage","activatedNotice","lockOverlay","premiumFeatures"].forEach(function(id){
      var el=document.getElementById(id); if(el&&el.parentNode) el.parentNode.removeChild(el);
    });
    document.querySelectorAll(".lock-icon").forEach(function(el){ el.remove(); });
    document.querySelectorAll(".feature-card.locked").forEach(function(card){
      card.classList.remove("locked");
      var b=card.querySelector("button");
      if(b){ b.disabled=false; var t=b.textContent||""; if(t.indexOf("付费")>=0||t.indexOf("解锁")>=0) b.textContent="立即使用"; }
    });
    document.querySelectorAll("img").forEach(function(el){ if(/shoukuan/i.test(el.getAttribute("src")||"")) el.remove(); });
    var BAD=/付费解锁|激活码|收款码|付款后截图|领取激活码|解锁完整版|微信支付/;
    document.querySelectorAll("body *").forEach(function(el){
      if(!el.children.length && BAD.test(el.textContent||"") && !el.closest(".free-footer")) el.remove();
    });
  }catch(e){}
})();
</script>
