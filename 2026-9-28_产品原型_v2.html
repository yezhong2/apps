<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI行为模仿助手</title>
<style>
  body { font-family: Arial, sans-serif; color: #fff; background-color: #333; margin: 0; padding: 0; }
  .container { max-width: 600px; margin: 20px auto; padding: 20px; background-color: #444; border-radius: 10px; }
  .header { text-align: center; }
  .header h1 { margin: 0; }
  .header p { margin: 10px 0; font-size: 18px; }
  .features, .instructions { background-color: #555; padding: 15px; border-radius: 5px; margin-top: 20px; }
  .features ul { list-style: none; padding: 0; }
  .features li { background-color: #666; padding: 10px; border-radius: 5px; margin-top: 5px; }
  .instructions { margin-top: 40px; }
  .button { background-color: #0275d8; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; display: inline-block; margin-top: 10px; }
  .button:hover { background-color: #0056b3; }
  .button.secondary { background-color: #5cb85c; }
  .button.secondary:hover { background-color: #4cae4c; }
  .unlock { background-color: #777; padding: 20px; text-align: center; margin-top: 40px; }
  .unlock img { width: 200px; height: auto; }
  .unlock span { color: #ddd; font-size: 12px; display: block; margin-top: 10px; }
  .trial { background-color: #5cb85c; padding: 15px; border-radius: 5px; margin-top: 20px; text-align: center; }
  .data-display { background-color: #666; padding: 15px; border-radius: 5px; margin-top: 20px; text-align: center; }
  .data-item { display: inline-block; margin: 0 10px; }
  .data-value { font-size: 24px; font-weight: bold; color: #0275d8; }
  .feedback { position: fixed; top: 20px; right: 20px; background-color: #5cb85c; color: white; padding: 15px; border-radius: 5px; display: none; z-index: 1000; }
  .hot-feature { background-color: #ff9800; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
  .feature-title { font-weight: bold; margin-bottom: 5px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>AI行为模仿助手</h1>
    <p>让AI帮你模仿人类行为，轻松应对各种场合</p>
  </div>
  
  <div class="data-display">
    <div class="data-item">
      <div class="data-value">98%</div>
      <div>模仿准确率</div>
    </div>
    <div class="data-item">
      <div class="data-value">500+</div>
      <div>行为模式</div>
    </div>
    <div class="data-item">
      <div class="data-value">10k+</div>
      <div>用户信赖</div>
    </div>
  </div>
  
  <div class="features">
    <h3>热门功能</h3>
    <div class="hot-feature">
      <div class="feature-title">情绪识别与模仿</div>
      <div>精准捕捉并模仿人类情绪表达</div>
    </div>
    <ul>
      <li>识别多种情绪和行为模式</li>
      <li>定制化模仿你的动作</li>
      <li>实时反馈调整</li>
    </ul>
  </div>
  
  <div style="text-align: center; margin: 20px 0;">
    <button class="button" onclick="simulate()">模拟行为</button>
    <button class="button secondary" onclick="tryTrial()">免费试用</button>
  </div>
  
  <div class="instructions">
    <p>使用说明：</p>
    <p>1. 点击"模拟行为"按钮或"免费试用"体验高级功能。</p>
    <p>2. 观察AI助手的行为模仿。</p>
    <p>3. 根据需要进行调整。</p>
  </div>
  
  <div class="unlock">
    <h3 style="margin-top: 0;">解锁更多功能，提升效率！</h3>
    <p>立即解锁完整版，体验所有高级功能</p>
    <img src="shoukuan.png" alt="收款码" onerror="this.onerror=null; this.src='占位提示文字';">
    <span>联系开发者，微信：wxid_mztr7tpuejg212</span>
  </div>
</div>

<div class="feedback" id="feedback"></div>

<script>
function simulate() {
  showFeedback("正在模拟行为，请稍等...");
  setTimeout(() => {
    showFeedback("行为模拟完成！效果已更新。");
  }, 2000);
}

function tryTrial() {
  showFeedback("正在为您准备试用体验...");
  setTimeout(() => {
    showFeedback("试用成功！您现在可以使用高级功能30分钟。");
  }, 1500);
}

function showFeedback(message) {
  const feedback = document.getElementById('feedback');
  feedback.textContent = message;
  feedback.style.display = 'block';
  
  setTimeout(() => {
    feedback.style.display = 'none';
  }, 3000);
}
</script>
</body>
</html>
