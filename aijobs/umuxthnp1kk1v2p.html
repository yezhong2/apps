<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI result</title><style>body{font-family:-apple-system,PingFang SC,Microsoft YaHei,sans-serif;max-width:720px;margin:0 auto;padding:20px;line-height:1.75;background:#0f1115;color:#e6e9ef}h3{color:#22c55e}pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:15px}</style></head><body><h3>&#10004; Done</h3><pre>哈希表是一种数据结构，它通过计算键的哈希值来快速存储和检索数据。

类比：想象一下你的书架，每本书都有一个独特的编号。哈希表就像一个智能的书架，当你需要找一本书时，它通过编号（哈希值）直接找到书的位置，而不是逐本翻找。

要点：
1. 快速查找：通过哈希值直接定位数据，查找速度快。
2. 动态扩容：当存储的数据增多时，哈希表可以自动扩展容量。
3. 冲突解决：不同键可能产生相同的哈希值，哈希表有机制处理这种冲突。</pre></body></html>
