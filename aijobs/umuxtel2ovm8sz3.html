<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI result</title><style>body{font-family:-apple-system,PingFang SC,Microsoft YaHei,sans-serif;max-width:720px;margin:0 auto;padding:20px;line-height:1.75;background:#0f1115;color:#e6e9ef}h3{color:#22c55e}pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:15px}</style></head><body><h3>&#10004; Done</h3><pre>哈希表是一种数据结构，它通过哈希函数将键映射到表中的一个位置，从而快速检索和存储数据。

类比：想象一个停车场，每个车位都有一个编号，当你想找车时，直接根据车牌号（相当于键）找到对应的车位（相当于哈希值），这样就能快速找到你的车。

要点：
1. 使用哈希函数将键转换成索引。
2. 提高数据检索速度，平均时间复杂度为O(1)。
3. 可能存在哈希冲突，需要冲突解决策略。</pre></body></html>
