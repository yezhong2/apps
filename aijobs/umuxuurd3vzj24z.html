<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI result</title><style>body{font-family:-apple-system,PingFang SC,Microsoft YaHei,sans-serif;max-width:720px;margin:0 auto;padding:20px;line-height:1.75;background:#0f1115;color:#e6e9ef}h3{color:#22c55e}pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:15px}</style></head><body><h3>&#10004; Done</h3><pre>哈希表是一种数据结构，通过哈希函数将键映射到表中的位置，以便快速查找和存储数据。

类比：想象一个装满钥匙的抽屉，每个钥匙都有一个对应的孔，你只需要找到对应的孔就能快速取出钥匙，这就是哈希表的工作原理。

要点：
1. 使用哈希函数将键转换为索引。
2. 索引对应于数据存储的位置。
3. 提高数据检索速度，尤其是在大量数据中查找特定数据时。</pre></body></html>
