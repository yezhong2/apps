    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-tertiary: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --border: #333333;
        }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header Styles */
        header {
            background-color: var(--bg-secondary);
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
        }
        
        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }
        
        .search-box {
            position: relative;
        }
        
        .search-box input {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            padding: 0.5rem 2.5rem 0.5rem 1rem;
            border-radius: 5px;
            color: var(--text-primary);
            width: 200px;
        }
        
        .search-box button {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }
        
        /* Navigation Styles */
        nav {
            background-color: var(--bg-secondary);
            padding: 0.5rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-list {
            display: flex;
            list-style: none;
            gap: 2rem;
        }
        
        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
            padding: 0.5rem 0;
        }
        
        .nav-link:hover {
            color: var(--text-primary);
        }
        
        .nav-link.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }
        
        /* Main Content Styles */
        main {
            padding: 2rem 0;
        }
        
        .tool-section {
            background-color: var(--bg-secondary);
            border-radius: 10px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }
        
        .input-group {
            margin-bottom: 1rem;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }
        
        .input-group input,
        .input-group textarea {
            width: 100%;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            padding: 0.75rem;
            border-radius: 5px;
            color: var(--text-primary);
            resize: vertical;
        }
        
        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: 500;
        }
        
        .btn:hover {
            background-color: var(--accent-hover);
        }
        
        .btn-secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }
        
        .btn-secondary:hover {
            background-color: #3a3a3a;
        }
        
        .result-container {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: var(--bg-tertiary);
            border-radius: 5px;
            display: none;
        }
        
        .result-container.show {
            display: block;
        }
        
        /* Mind Map Styles */
        .mind-map-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .mind-map-node {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            min-width: 150px;
            position: relative;
        }
        
        .mind-map-node.main {
            background-color: var(--accent);
            color: white;
        }
        
        .mind-map-node.primary {
            background-color: #4f46e5;
            color: white;
        }
        
        /* Learning Resources Styles */
        .resource-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .resource-card {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
        }
        
        .resource-title {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        
        .resource-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .resource-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        /* Loading Spinner */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
            
            .search-box input {
                width: 100%;
            }
            
            .nav-list {
                flex-wrap: wrap;
                gap: 1rem;
            }
            
            .mind-map-container {
                flex-direction: column;
            }
            
            .resource-list {
                grid-template-columns: 1fr;
            }
        }
    </style>

<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="#" class="logo">MindFlow</a>
                <div class="search-box">
                    <input type="text" placeholder="Search tools...">
                    <button>🔍</button>
                </div>
                <div class="user-menu">
                    <div class="user-avatar">U</div>
                </div>
            </div>
        </div>
    </header>
    
    <nav>
        <div class="container">
            <ul class="nav-list">
                <li><a href="#" class="nav-link active">Thinking Tools</a></li>
                <li><a href="#" class="nav-link">Learning Resources</a></li>
                <li><a href="#" class="nav-link">About Us</a></li>
            </ul>
        </div>
    </nav>
    
    <main class="container">
        <!-- Mind Map Drawing Tool -->
        <section class="tool-section">
            <h2 class="section-title">Mind Map Drawing</h2>
            <div class="input-group">
                <label for="keyword-input">Enter keyword</label>
                <textarea id="keyword-input" rows="3" placeholder="Enter a keyword to generate a mind map..."></textarea>
            </div>
            <button id="generate-mindmap" class="btn">Generate Mind Map</button>
            <div id="mindmap-result" class="result-container">
                <div id="mindmap-display" class="mind-map-container"></div>
            </div>
        </section>
        
        <!-- Mind Path Planning Tool -->
        <section class="tool-section">
            <h2 class="section-title">Mind Path Planning</h2>
            <div class="input-group">
                <label for="goal-input">Enter your goal</label>
                <textarea id="goal-input" rows="3" placeholder="Describe what you want to achieve..."></textarea>
            </div>
            <button id="plan-path" class="btn">Get Path Planning</button>
            <div id="path-result" class="result-container">
                <div id="path-display"></div>
            </div>
        </section>
        
        <!-- Problem Solving Tool -->
        <section class="tool-section">
            <h2 class="section-title">Problem Solving Analysis</h2>
            <div class="input-group">
                <label for="problem-input">Describe your problem</label>
                <textarea id="problem-input" rows="3" placeholder="Enter the problem you need help solving..."></textarea>
            </div>
            <button id="analyze-problem" class="btn">Analyze Problem</button>
            <div id="problem-result" class="result-container">
                <div id="problem-display"></div>
            </div>
        </section>
        
        <!-- Creative Thinking Tool -->
        <section class="tool-section">
            <h2 class="section-title">Creative Thinking Inspiration</h2>
            <div class="input-group">
                <label for="idea-input">Enter your idea</label>
                <textarea id="idea-input" rows="3" placeholder="Share your initial idea for creative expansion..."></textarea>
            </div>
            <button id="get-inspiration" class="btn">Get Creative Ideas</button>
            <div id="inspiration-result" class="result-container">
                <div id="inspiration-display"></div>
            </div>
        </section>
        
        <!-- Learning Resources Tool -->
        <section class="tool-section">
            <h2 class="section-title">Learning Resources Recommendation</h2>
            <div class="input-group">
                <label for="field-input">Enter learning field</label>
                <input type="text" id="field-input" placeholder="e.g., Web Development, Data Science...">
            </div>
            <button id="get-resources" class="btn">Find Resources</button>
            <div id="resources-result" class="result-container">
                <div id="resources-display" class="resource-list"></div>
            </div>
            <div class="export-section" style="margin-top: 1rem;">
                <button id="export-all" class="btn btn-secondary">Export All Results to PDF</button>
            </div>
        </section>
    </main>
    
    <script>
        // Navigation functionality
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                this.classList.add('active');
            });
        });
        
        // Mind Map Drawing Functionality
        document.getElementById('generate-mindmap').addEventListener('click', function() {
            const keyword = document.getElementById('keyword-input').value.trim();
            const resultContainer = document.getElementById('mindmap-result');
            const mindmapDisplay = document.getElementById('mindmap-display');
            
            if (!keyword) {
                alert('Please enter a keyword');
                return;
            }
            
            // Show loading state
            resultContainer.classList.add('show');
            mindmapDisplay.innerHTML = '<div class="loading"></div> Generating mind map...';
            
            // Generate mind map locally
            setTimeout(() => {
                mindmapDisplay.innerHTML = '';
                
                // Main concept
                const mainNode = document.createElement('div');
                mainNode.className = 'mind-map-node main';
                mainNode.textContent = keyword;
                mindmapDisplay.appendChild(mainNode);
                
                // Generate related concepts
                const concepts = generateRelatedConcepts(keyword);
                
                concepts.forEach((concept, index) => {
                    if (concept.trim() && index < 5) {
                        const node = document.createElement('div');
                        node.className = 'mind-map-node primary';
                        node.textContent = concept.trim();
                        mindmapDisplay.appendChild(node);
                        
                        // Add sub-concepts
                        if (index < 3) {
                            for (let i = 0; i < 2; i++) {
                                const subNode = document.createElement('div');
                                subNode.className = 'mind-map-node';
                                subNode.textContent = `${concept.trim()} - Point ${i + 1}`;
                                mindmapDisplay.appendChild(subNode);
                            }
                        }
                    }
                });
            }, 1000);
        });
        
        // Mind Path Planning Functionality
        document.getElementById('plan-path').addEventListener('click', function() {
            const goal = document.getElementById('goal-input').value.trim();
            const resultContainer = document.getElementById('path-result');
            const pathDisplay = document.getElementById('path-display');
            
            if (!goal) {
                alert('Please enter your goal');
                return;
            }
            
            // Show loading state
            resultContainer.classList.add('show');
            pathDisplay.innerHTML = '<div class="loading"></div> Planning your path...';
            
            // Generate path planning locally
            setTimeout(() => {
                const path = generatePathPlan(goal);
                pathDisplay.innerHTML = `
                    <h3>Your Path to Success</h3>
                    <div>${path}</div>
                `;
            }, 1000);
        });
        
        // Problem Solving Functionality
        document.getElementById('analyze-problem').addEventListener('click', function() {
            const problem = document.getElementById('problem-input').value.trim();
            const resultContainer = document.getElementById('problem-result');
            const problemDisplay = document.getElementById('problem-display');
            
            if (!problem) {
                alert('Please describe your problem');
                return;
            }
            
            // Show loading state
            resultContainer.classList.add('show');
            problemDisplay.innerHTML = '<div class="loading"></div> Analyzing your problem...';
            
            // Generate problem analysis locally
            setTimeout(() => {
                const analysis = analyzeProblem(problem);
                problemDisplay.innerHTML = `
                    <h3>Problem Analysis</h3>
                    <div>${analysis}</div>
                `;
            }, 1000);
        });
        
        // Creative Thinking Functionality
        document.getElementById('get-inspiration').addEventListener('click', function() {
            const idea = document.getElementById('idea-input').value.trim();
            const resultContainer = document.getElementById('inspiration-result');
            const inspirationDisplay = document.getElementById('inspiration-display');
            
            if (!idea) {
                alert('Please enter your idea');
                return;
            }
            
            // Show loading state
            resultContainer.classList.add('show');
            inspirationDisplay.innerHTML = '<div class="loading"></div> Generating creative ideas...';
            
            // Generate creative ideas locally
            setTimeout(() => {
                const ideas = generateCreativeIdeas(idea);
                inspirationDisplay.innerHTML = `
                    <h3>Creative Expansion</h3>
                    <div>${ideas}</div>
                `;
            }, 1000);
        });
        
        // Learning Resources Functionality
        document.getElementById('get-resources').addEventListener('click', function() {
            const field = document.getElementById('field-input').value.trim();
            const resultContainer = document.getElementById('resources-result');
            const resourcesDisplay = document.getElementById('resources-display');
            
            if (!field) {
                alert('Please enter a learning field');
                return;
            }
            
            // Show loading state
            resultContainer.classList.add('show');
            resourcesDisplay.innerHTML = '<div class="loading"></div> Finding resources...';
            
            // Generate resources locally
            setTimeout(() => {
                const resources = generateLearningResources(field);
                resourcesDisplay.innerHTML = '';
                
                resources.forEach((resource, index) => {
                    const card = document.createElement('div');
                    card.className = 'resource-card';
                    card.innerHTML = `
                        <div class="resource-title">${field} Resource ${index + 1}</div>
                        <div class="resource-description">${resource}</div>
                        <a href="#" class="resource-link">Learn more →</a>
                    `;
                    resourcesDisplay.appendChild(card);
                });
            }, 1000);
        });
        
        // User menu functionality
        document.querySelector('.user-avatar').addEventListener('click', function() {
            alert('User menu functionality would go here');
        });
        
        // Search functionality
        document.querySelector('.search-box button').addEventListener('click', function() {
            const searchTerm = document.querySelector('.search-box input').value.trim();
            if (searchTerm) {
                alert(`Searching for: ${searchTerm}`);
            }
        });
        
        // Batch Export Functionality
        document.getElementById('export-all').addEventListener('click', function() {
            const allResults = [];
            
            // Collect all generated results
            const mindmapResult = document.getElementById('mindmap-display').innerHTML;
            const pathResult = document.getElementById('path-display').innerHTML;
            const problemResult = document.getElementById('problem-display').innerHTML;
            const inspirationResult = document.getElementById('inspiration-display').innerHTML;
            const resourcesResult = document.getElementById('resources-display').innerHTML;
            
            if (mindmapResult && mindmapResult.includes('mind-map-node')) {
                allResults.push({ title: 'Mind Map', content: mindmapResult });
            }
            
            if (pathResult && !pathResult.includes('Planning your path')) {
                allResults.push({ title: 'Path Planning', content: pathResult });
            }
            
            if (problemResult && !problemResult.includes('Analyzing your problem')) {
                allResults.push({ title: 'Problem Analysis', content: problemResult });
            }
            
            if (inspirationResult && !inspirationResult.includes('Generating creative ideas')) {
                allResults.push({ title: 'Creative Ideas', content: inspirationResult });
            }
            
            if (resourcesResult && resourcesResult.includes('resource-card')) {
                allResults.push({ title: 'Learning Resources', content: resourcesResult });
            }
            
            if (allResults.length === 0) {
                alert('No results to export. Please generate some content first.');
                return;
            }
            
            // Generate PDF content
            const pdfContent = generatePDFContent(allResults);
            
            // Create a blob and download
            const blob = new Blob([pdfContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'mindflow-results.pdf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
        
        function generatePDFContent(results) {
            let html = `
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <title>MindFlow Results</title>
                    <style>
                        body { font-family: Arial, sans-serif; line-height: 1.6; padding: 20px; }
                        h1 { color: #6366f1; }
                        h2 { color: #6366f1; margin-top: 2em; }
                        .result-section { margin-bottom: 2em; }
                        .mind-map-node { 
                            background-color: #2a2a2a; 
                            border: 1px solid #333333; 
                            border-radius: 8px; 
                            padding: 1rem; 
                            margin-bottom: 0.5rem; 
                            display: inline-block; 
                            margin-right: 0.5rem; 
                        }
                        .mind-map-node.main { background-color: #6366f1; color: white; }
                        .mind-map-node.primary { background-color: #4f46e5; color: white; }
                        .resource-card { 
                            background-color: #2a2a2a; 
                            border: 1px solid #333333; 
                            border-radius: 8px; 
                            padding: 1rem; 
                            margin-bottom: 1rem; 
                        }
                    </style>
                </head>
                <body>
                    <h1>MindFlow Results</h1>
            `;
            
            results.forEach(result => {
                html += `
                    <div class="result-section">
                        <h2>${result.title}</h2>
                        <div>${result.content}</div>
                    </div>
                `;
            });
            
            html += `
                </body>
                </html>
            `;
            
            return html;
        }
        
        // Helper functions for local processing
        function generateRelatedConcepts(keyword) {
            const conceptMap = {
                'programming': ['algorithms', 'data structures', 'software engineering', 'web development', 'mobile apps', 'AI/ML'],
                'design': ['UI/UX', 'graphic design', 'typography', 'color theory', 'user research', 'prototyping'],
                'business': ['marketing', 'finance', 'management', 'strategy', 'operations', 'innovation'],
                'science': ['biology', 'chemistry', 'physics', 'mathematics', 'research methods', 'data analysis'],
                'art': ['drawing', 'painting', 'sculpture', 'digital art', 'art history', 'critique'],
                'language': ['grammar', 'vocabulary', 'conversation', 'writing', 'literature', 'translation'],
                'health': ['nutrition', 'exercise', 'mental health', 'medicine', 'wellness', 'prevention'],
                'education': ['pedagogy', 'curriculum', 'assessment', 'educational technology', 'learning theories', 'teaching methods']
            };
            
            // Find matching category
            const category = Object.keys(conceptMap).find(cat => 
                keyword.toLowerCase().includes(cat) || cat.includes(keyword.toLowerCase())
            );
            
            if (category && conceptMap[category]) {
                return conceptMap[category];
            }
            
            // Default concepts if no match
            return [
                `${keyword} fundamentals`,
                `advanced ${keyword}`,
                `${keyword} applications`,
                `${keyword} tools`,
                `related to ${keyword}`,
                `${keyword} resources`
            ];
        }
        
        function generatePathPlan(goal) {
            const steps = [
                `1. Define your goal clearly: ${goal}`,
                '2. Break down the goal into smaller, manageable tasks',
                '3. Identify necessary resources and skills',
                '4. Create a timeline with milestones',
                '5. Establish a regular review process',
                '6. Build in flexibility for adjustments',
                '7. Find mentors or communities for support',
                '8. Celebrate progress and achievements'
            ];
            
            return steps.join('<br><br>');
        }
        
        function analyzeProblem(problem) {
            const analysis = [
                `<strong>Problem Statement:</strong> ${problem}`,
                '<br><br><strong>Key Components:</strong>',
                '- Identify the main issue',
                '- Recognize contributing factors',
                '- Determine scope and impact',
                '<br><br><strong>Possible Approaches:</strong>',
                '- Analyze root causes',
                '- Consider different perspectives',
                '- Evaluate potential solutions',
                '<br><br><strong>Next Steps:</strong>',
                '- Gather relevant information',
                '- Prioritize solution options',
                '- Develop an action plan'
            ];
            
            return analysis.join('<br>');
        }
        
        function generateCreativeIdeas(idea) {
            const expansions = [
                `<strong>Original Idea:</strong> ${idea}`,
                '<br><br><strong>Possible Expansions:</strong>',
                `- How can ${idea} be applied to different contexts?`,
                `- What combinations with other ideas could work?`,
                `- How might technology enhance ${idea}?`,
                `- What variations of ${idea} could be explored?`,
                `<br><br><strong>Inspiration Questions:</strong>`,
                `- What if you approached ${idea} from a completely different angle?`,
                `- Who would benefit most from ${idea}?`,
                `- How could ${idea} be made more accessible?`
            ];
            
            return expansions.join('<br>');
        }
        
        function generateLearningResources(field) {
            const resources = [
                `Beginner-friendly ${field} tutorials and courses`,
                `Advanced ${field} books and research papers`,
                `${field} communities and forums for discussion`,
                `Tools and software commonly used in ${field}`,
                `${field} case studies and real-world applications`,
                `Professional organizations and certifications in ${field}`
            ];
            
            return resources;
