<body>
    <div class="container">
        <header>
            <h1>Code Index Optimizer</h1>
            <p class="subtitle">Improve your code search and navigation efficiency with offline tools</p>
        </header>

        <!-- Search Section -->
        <section class="section">
            <h2 class="section-title">Code Keyword Search</h2>
            <div class="input-group">
                <label for="search-keyword">Enter keywords to search in code:</label>
                <input type="text" id="search-keyword" placeholder="e.g., function, loop, variable">
            </div>
            <button class="full-width" id="search-btn">Search Code</button>
            <div id="search-results" class="result-box" style="display: none;"></div>
        </section>

        <!-- Sorting Section -->
        <section class="section">
            <h2 class="section-title">Code Snippet Sorter</h2>
            <div class="input-group">
                <label for="sort-code">Paste code to sort:</label>
                <textarea id="sort-code" rows="6" placeholder="Paste your code here..."></textarea>
            </div>
            <button class="full-width" id="sort-btn">Sort Code</button>
            <div id="sort-result" class="result-box" style="display: none;"></div>
        </section>

        <!-- Comment Generation Section -->
        <section class="section">
            <h2 class="section-title">Comment Generator</h2>
            <div class="input-group">
                <label for="comment-code">Paste code to generate comments:</label>
                <textarea id="comment-code" rows="6" placeholder="Paste your code here..."></textarea>
            </div>
            <button class="full-width" id="comment-btn">Generate Comments</button>
            <div id="comment-result" class="result-box" style="display: none;"></div>
        </section>

        <!-- Style Check Section -->
        <section class="section">
            <h2 class="section-title">Code Style Checker</h2>
            <div class="input-group">
                <label for="style-code">Paste code to check style:</label>
                <textarea id="style-code" rows="6" placeholder="Paste your code here..."></textarea>
            </div>
            <button class="full-width" id="style-btn">Check Style</button>
            <div id="style-result" class="style-result" style="display: none;"></div>
        </section>

        <!-- Code Comparison Section -->
        <section class="section">
            <h2 class="section-title">Code Comparison Tool</h2>
            <div class="two-column">
                <div>
                    <div class="input-group">
                        <label for="compare-code1">First code snippet:</label>
                        <textarea id="compare-code1" rows="8" placeholder="Paste first code here..."></textarea>
                    </div>
                </div>
                <div>
                    <div class="input-group">
                        <label for="compare-code2">Second code snippet:</label>
                        <textarea id="compare-code2" rows="8" placeholder="Paste second code here..."></textarea>
                    </div>
                </div>
            </div>
            <button class="full-width" id="compare-btn">Compare Code</button>
            <div id="compare-result" class="result-box" style="display: none;"></div>
        </section>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        // Sample code database for demonstration
        const codeDatabase = [
            {
                id: 1,
                title: "Array Sorting Function",
                keywords: ["array", "sort", "function"],
                code: `function sortArray(arr) {
    return arr.sort((a, b) => a - b);
}`
            },
            {
                id: 2,
                title: "Object Filter",
                keywords: ["object", "filter", "array"],
                code: `function filterObject(obj, predicate) {
    return Object.keys(obj).filter(key => predicate(obj[key], key));
}`
            },
            {
                id: 3,
                title: "API Request Handler",
                keywords: ["api", "request", "fetch", "async"],
                code: `async function fetchData(url) {
    try {
        const response = await fetch(url);
        return await response.json();
    } catch (error) {
        console.error('Error fetching data:', error);
    }
}`
            },
            {
                id: 4,
                title: "DOM Element Creation",
                keywords: ["dom", "element", "create", "append"],
                code: `function createElement(tag, attributes, content) {
    const element = document.createElement(tag);
    
    for (const key in attributes) {
        element.setAttribute(key, attributes[key]);
    }
    
    if (content) {
        element.textContent = content;
    }
    
    return element;
}`
            },
            {
                id: 5,
                title: "Debounce Function",
                keywords: ["debounce", "function", "performance"],
                code: `function debounce(func, delay) {
    let timeoutId;
    
    return function(...args) {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => func.apply(this, args), delay);
    };
}`
            }
        ];

        // Notification system
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 5000);
        }

        // Code keyword search
        document.getElementById('search-btn').addEventListener('click', function() {
            const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('search-results');
            
            if (!keyword) {
                showNotification('Please enter a keyword to search', 'warning');
                return;
            }
            
            const results = codeDatabase.filter(item => 
                item.keywords.some(kw => kw.includes(keyword)) || 
                item.code.toLowerCase().includes(keyword) ||
                item.title.toLowerCase().includes(keyword)
            );
            
            if (results.length === 0) {
                resultsDiv.textContent = 'No matching code found. Try different keywords.';
                showNotification('No results found', 'warning');
            } else {
                resultsDiv.innerHTML = results.map(item => 
                    `<div class="code-block">
                        <h4>${item.title}</h4>
                        <pre>${item.code}</pre>
                    </div>`
                ).join('');
                showNotification(`Found ${results.length} matching code snippets`, 'success');
            }
            
            resultsDiv.style.display = 'block';
        });

        // Code sorting
        document.getElementById('sort-btn').addEventListener('click', function() {
            const codeInput = document.getElementById('sort-code').value.trim();
            const resultDiv = document.getElementById('sort-result');
            
            if (!codeInput) {
                showNotification('Please paste code to sort', 'warning');
                return;
            }
            
            // Split code into lines and filter out empty lines
            const lines = codeInput.split('\n').filter(line => line.trim() !== '');
            
            // Sort lines alphabetically
            const sortedLines = [...lines].sort((a, b) => a.localeCompare(b));
            
            resultDiv.textContent = sortedLines.join('\n');
            resultDiv.style.display = 'block';
            showNotification('Code sorted successfully', 'success');
        });

        // Comment generation
        document.getElementById('comment-btn').addEventListener('click', function() {
            const codeInput = document.getElementById('comment-code').value.trim();
            const resultDiv = document.getElementById('comment-result');
            
            if (!codeInput) {
                showNotification('Please paste code to generate comments', 'warning');
                return;
            }
            
            // Simple comment generation based on code patterns
            const lines = codeInput.split('\n');
            const commentedLines = lines.map(line => {
                const trimmed = line.trim();
                
                // Skip empty lines
                if (!trimmed) return line;
                
                // Check if line already has comment
                if (trimmed.startsWith('//') || trimmed.includes('/*')) {
                    return line;
                }
                
                // Add comment based on code pattern
                if (trimmed.includes('function')) {
                    return `// Function definition: ${trimmed}\n${line}`;
                } else if (trimmed.includes('const') || trimmed.includes('let') || trimmed.includes('var')) {
                    return `// Variable declaration: ${trimmed}\n${line}`;
                } else if (trimmed.includes('if')) {
                    return `// Conditional statement: ${trimmed}\n${line}`;
                } else if (trimmed.includes('for') || trimmed.includes('while')) {
                    return `// Loop statement: ${trimmed}\n${line}`;
                } else if (trimmed.includes('return')) {
                    return `// Return statement: ${trimmed}\n${line}`;
                } else if (trimmed.includes('//') === false && trimmed.includes('/*') === false) {
                    return `// Code line: ${trimmed}\n${line}`;
                }
                
                return line;
            });
            
            resultDiv.textContent = commentedLines.join('\n');
            resultDiv.style.display = 'block';
            showNotification('Comments generated successfully', 'success');
        });

        // Style checking
        document.getElementById('style-btn').addEventListener('click', function() {
            const codeInput = document.getElementById('style-code').value.trim();
            const resultDiv = document.getElementById('style-result');
            
            if (!codeInput) {
                showNotification('Please paste code to check style', 'warning');
                return;
            }
            
            const issues = [];
            
            // Check for semicolons
            const lines = codeInput.split('\n');
            lines.forEach((line, index) => {
                const trimmed = line.trim();
                if (trimmed && !trimmed.startsWith('//') && !trimmed.startsWith('/*') && 
                    !trimmed.includes('if') && !trimmed.includes('for') && !trimmed.includes('while') &&
                    !trimmed.includes('function') && !trimmed.includes('return') && 
                    !trimmed.includes('else') && !trimmed.includes('catch') && 
                    !trimmed.includes('finally') && !trimmed.endsWith(';') && 
                    !trimmed.includes('=>') && !trimmed.includes('{') && !trimmed.includes('}')) {
                    issues.push({
                        line: index + 1,
                        message: 'Missing semicolon',
                        type: 'warning'
                    });
                }
            });
            
            // Check for consistent indentation
            let indentSize = null;
            lines.forEach((line, index) => {
                const match = line.match(/^(\s+)/);
                if (match) {
                    const currentIndent = match[1].length;
                    if (indentSize === null) {
                        indentSize = currentIndent;
                    } else if (currentIndent % indentSize !== 0) {
                        issues.push({
                            line: index + 1,
                            message: 'Inconsistent indentation',
                            type: 'error'
                        });
                    }
                }
            });
            
            // Check for spacing around operators
            lines.forEach((line, index) => {
                if (line.includes('=') && !line.includes('==') && !line.includes('===') && 
                    !line.includes('!=') && !line.includes('!==') && 
                    !line.includes('>=') && !line.includes('<=') && 
                    !line.includes('+=') && !line.includes('-=') && 
                    !line.includes('*=') && !line.includes('/=')) {
                    
                    if (!line.match(/\s=\s/) && !line.match(/\s\+=\s/) && 
                        !line.match(/\s-=\s/) && !line.match(/\s\*\s/) && 
                        !line.match(/\s\/\s/)) {
                        issues.push({
                            line: index + 1,
                            message: 'Missing spaces around operator',
                            type: 'warning'
                        });
                    }
                }
            });
            
            // Display results
            if (issues.length === 0) {
                resultDiv.innerHTML = `
                    <div class="style-item">
                        <div class="status-icon success">✓</div>
                        <div>No style issues found</div>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = issues.map(issue => 
                    `<div class="style-item">
                        <div class="status-icon ${issue.type}">${issue.type === 'error' ? '✗' : '⚠'}</div>
                        <div>
                            <strong>Line ${issue.line}:</strong> ${issue.message}
                        </div>
                    </div>`
                ).join('');
            }
            
            resultDiv.style.display = 'block';
            showNotification(`Style check completed with ${issues.length} issues found`, issues.length > 0 ? 'warning' : 'success');
        });

        // Code comparison
        document.getElementById('compare-btn').addEventListener('click', function() {
            const code1 = document.getElementById('compare-code1').value.trim();
            const code2 = document.getElementById('compare-code2').value.trim();
            const resultDiv = document.getElementById('compare-result');
            
            if (!code1 || !code2) {
                showNotification('Please paste both code snippets to compare', 'warning');
                return;
            }
            
            const lines1 = code1.split('\n');
            const lines2 = code2.split('\n');
            const maxLines = Math.max(lines1.length, lines2.length);
            const diff = [];
            
            for (let i = 0; i < maxLines; i++) {
                const line1 = lines1[i] || '';
                const line2 = lines2[i] || '';
                
                if (line1 !== line2) {
                    if (line1 === '') {
                        diff.push({
                            line: i + 1,
                            type: 'added',
                            content: line2
                        });
                    } else if (line2 === '') {
                        diff.push({
                            line: i + 1,
                            type: 'removed',
                            content: line1
                        });
                    } else {
                        diff.push({
                            line: i + 1,
                            type: 'changed',
                            content1: line1,
                            content2: line2
                        });
                    }
                }
            }
            
            if (diff.length === 0) {
                resultDiv.textContent = 'No differences found between the code snippets';
                showNotification('Code snippets are identical', 'success');
            } else {
                resultDiv.innerHTML = diff.map(item => {
                    if (item.type === 'added') {
                        return `<div class="code-block diff-added">+ ${item.content}</div>`;
                    } else if (item.type === 'removed') {
                        return `<div class="code-block diff-removed">- ${item.content}</div>`;
                    } else {
                        return `
                            <div class="code-block diff-changed">
                                <div>- ${item.content1}</div>
                                <div>+ ${item.content2}</div>
                            </div>
                        `;
                    }
                }).join('');
                showNotification(`Found ${diff.length} differences between code snippets`, 'success');
            }
            
            resultDiv.style.display = 'block';
        });

        // Initialize with sample code
        document.getElementById('sort-code').value = `const b = 2;
const a = 1;
const c = 3;`;

        document.getElementById('comment-code').value = `function calculateSum(a, b) {
    const result = a + b;
    return result;
}`;

        document.getElementById('style-code').value = `function greet(name){
    return "Hello, "+name;
}`;

        document.getElementById('compare-code1').value = `function add(a, b) {
    return a + b;
}

function subtract(a, b) {
    return a - b;
}`;

        document.getElementById('compare-code2').value = `function add(a, b) {
    const result = a + b;
    return result;
}

function multiply(a, b) {
    return a * b;
}`;
    </script>
