:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--txt:#e6e9ef;--sub:#8b93a3;--acc:#00a884;--acc2:#ffb020;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

.tabs{display:flex;gap:8px;padding:14px 16px 4px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:8px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--sub);font-size:13px;cursor:pointer;transition:all 0.3s ease;}
.tab:hover{transform:translateY(-2px);border-color:var(--acc2);}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 16px;animation:slideUp 0.8s ease-out forwards;opacity:0;transform:translateY(20px);}
@keyframes slideUp{to{opacity:1;transform:translateY(0);}}
.card h3{font-size:15px;margin-bottom:10px;color:var(--acc2);}
.chip{display:inline-block;padding:6px 12px;border-radius:14px;background:#232835;border:1px solid var(--line);margin:4px 6px 4px 0;font-size:13px;cursor:pointer;transition:.15s;}
.chip:hover{transform:scale(1.05);background:#2a2f3a;}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--acc);color:#fff;font-size:15px;cursor:pointer;margin-top:12px;position:relative;overflow:hidden;transition:all 0.3s ease;}
.btn:active{opacity:.85;transform:scale(0.98);}
.btn::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:rgba(255,255,255,0.2);transform:translate(-50%,-50%);transition:width 0.6s,height 0.6s;}

.recipe{background:#0c0e13;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;display:none;animation:fadeIn 0.5s ease-in-out;}
.recipe.show{display:block;}
.recipe h4{font-size:15px;color:#fff;margin-bottom:6px;}
.recipe .k{font-size:12px;color:var(--sub);line-height:1.8;}
.recipe .k b{color:var(--acc2);font-weight:600;}
.drink{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:#0c0e13;animation:fadeIn 0.6s ease-in-out;}
.drink h4{font-size:14px;margin-bottom:4px;}
.drink p{font-size:12px;color:var(--sub);line-height:1.7;}
.search-box{display:flex;gap:8px;margin:12px 16px;}
.search-box input{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0c0e13;color:var(--txt);font-size:13px;outline:none;transition:border-color 0.3s ease;}
.search-box input:focus{border-color:var(--acc2);}
.search-box button{padding:10px 16px;border-radius:8px;border:none;background:var(--acc);color:#fff;font-size:13px;cursor:pointer;transition:all 0.3s ease;}
.search-box button:active{opacity:.85;transform:scale(0.98);}

<body>
<header>
  <h1>🥗 AI食谱助手</h1>
  <div class="tag">智能健康饮食 · 吃对每一餐</div>
  <div class="sub">输入食材秒出食谱 · 热量计算 · 家庭饮品 DIY</div>
</header>

<div class="tabs">
  <div class="tab active" data-p="rec">🍳 快速制作</div>
  <div class="tab" data-p="cal">🔥 热量计算</div>
  <div class="tab" data-p="drink">☕ 饮品 DIY</div>
</div>

<div id="p-rec">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索食材...">
    <button id="searchBtn">搜索</button>
  </div>
  <div class="card">
    <h3>我有这些食材，能做什么？</h3>
    <div id="ingList"></div>
    <button class="btn" id="btnGo">推荐食谱</button>
    <div id="recOut"></div>
  </div>
</div>

<div id="p-cal" style="display:none">
  <div class="card">
    <h3>🔥 今日摄入热量估算</h3>
    <div id="foodList"></div>
    <div class="cal-row"><input id="calInput" type="number" placeholder="输入重量（克）"><button class="btn" style="margin:0;width:auto;padding:10px 18px" id="btnAdd">＋添加</button></div>
    <div id="calOut">已选 0 项 · 共 0 千卡</div>
  </div>
</div>

<div id="p-drink" style="display:none">
  <div class="card">
    <h3>☕ 家庭饮品 DIY 指南</h3>
    <div id="drinkList"></div>
  </div>
</div>

<script>
// ===== 数据 =====
var RECIPES = [
  {n:"番茄炒蛋", ing:["番茄","鸡蛋"], k:"<b>食材：</b>番茄2个、鸡蛋3个、葱、盐、糖<br><b>步骤：</b>①鸡蛋打散炒熟盛出 ②番茄切块下锅炒出汁 ③倒入鸡蛋翻炒，加盐糖调味 ④撒葱花出锅<br><b>热量：</b>约 260 千卡/份"},
  {n:"鸡胸肉蔬菜沙拉", ing:["鸡胸肉","生菜"], k:"<b>食材：</b>鸡胸肉1块、生菜、小番茄、黄瓜、油醋汁<br><b>步骤：</b>①鸡胸肉煮熟撕丝 ②蔬菜洗净切好 ③混合淋汁拌匀<br><b>热量：</b>约 320 千卡/份"},
  {n:"燕麦牛奶早餐", ing:["燕麦","牛奶","鸡蛋"], k:"<b>食材：</b>燕麦40g、牛奶250ml、鸡蛋1个、坚果少许<br><b>步骤：</b>①燕麦加牛奶小火煮3分钟 ②打入鸡蛋搅匀 ③撒坚果<br><b>热量：</b>约 380 千卡/份"},
  {n:"清蒸鲈鱼", ing:["鱼","鲈鱼"], k:"<b>食材：</b>鲈鱼1条、姜、葱、蒸鱼豉油<br><b>步骤：</b>①鱼划刀铺姜丝 ②水开蒸8分钟 ③倒掉汁水淋豉油撒葱丝浇热油<br><b>热量：</b>约 280 千卡/份"},
  {n:"冬瓜虾仁汤", ing:["冬瓜","虾"], k:"<b>食材：</b>冬瓜300g、虾仁150g、姜<br><b>步骤：</b>①冬瓜切片 ②虾仁姜丝爆香 ③加水煮冬瓜至透明 ④下虾仁再煮2分钟<br><b>热量：</b>约 150 千卡/份"},
  {n:"麻婆豆腐", ing:["豆腐","肉末"], k:"<b>食材：</b>豆腐1盒、肉末100g、豆瓣酱、花椒<br><b>步骤：</b>①肉末炒散加豆瓣酱 ②加水下豆腐块 ③焖3分钟勾芡 ④撒花椒葱花<br><b>热量：</b>约 420 千卡/份"},
  {n:"蒜蓉西兰花", ing:["西兰花"], k:"<b>食材：</b>西兰花1颗、蒜、蚝油<br><b>步骤：</b>①西兰花焯水1分钟 ②蒜末爆香 ③下西兰花加蚝油翻炒<br><b>热量：</b>约 120 千卡/份"},
  {n:"杂粮饭", ing:["米饭","糙米"], k:"<b>食材：</b>大米、糙米、小米 1:1:1<br><b>步骤：</b>①混合洗净 ②加水（1:1.3）浸泡20分钟 ③电饭煲杂粮模式<br><b>热量：</b>约 200 千卡/碗"}
];
var FOODS = [
  {n:"米饭", c:116},{n:"馒头", c:223},{n:"面条(熟)", c:110},{n:"鸡胸肉", c:133},{n:"鸡蛋", c:144},
  {n:"牛肉", c:125},{n:"猪肉", c:395},{n:"鱼", c:110},{n:"豆腐", c:81},{n:"牛奶", c:54},
  {n:"苹果", c:52},{n:"香蕉", c:93},{n:"西兰花", c:36},{n:"番茄", c:20},{n:"土豆", c:81}
];
var DRINKS = [
  {n:"冰美式", d:"浓缩咖啡 1 份（30ml）＋ 冰水 200ml ＋ 冰块。先加冰，倒入咖啡液，再补冰水，3 分钟搞定，约 5 千卡。"},
  {n:"生椰拿铁", d:"浓缩咖啡 1 份 ＋ 厚椰乳 150ml ＋ 冰。杯中加冰，倒椰乳，缓缓淋入咖啡液形成分层，约 160 千卡。"},
  {n:"柠檬气泡水", d:"柠檬 2 片 ＋ 苏打水 300ml ＋ 蜂蜜 1 小勺。柠檬片压出汁，加冰加苏打水，最后蜂蜜调味，约 40 千卡。"},
  {n:"绿豆牛乳冰", d:"熟绿豆 50g ＋ 牛奶 200ml ＋ 炼乳 10g ＋ 冰。全部倒入破壁机打 30 秒，约 220 千卡。"}
];

// ===== 食材选择 =====
var sel = {};
function renderIngs(){
  var box = document.getElementById("ingList");
  var all = [];
  RECIPES.forEach(function(r){ r.ing.forEach(function(i){ if(all.indexOf(i)<0) all.push(i); }); });
  box.innerHTML = all.map(function(i){
    return '<span class="chip'+(sel[i]?' on':'')+'" data-i="'+i+'">'+i+'</span>';
  }).join("");
}
document.getElementById("ingList").addEventListener("click", function(e) {
  if(e.target.classList.contains("chip")) {
    var i = e.target.getAttribute("data-i");
    if(sel[i]) delete sel[i]; else sel[i]=1;
    renderIngs();
  }
});
document.getElementById("btnGo").onclick = function(){
  var out = document.getElementById("recOut");
  var keys = Object.keys(sel);
  if(!keys.length){ out.innerHTML = '<div class="recipe show"><h4>💡 先选 1-2 种你有的食材</h4></div>'; return; }
  var hit = RECIPES.filter(function(r){
    return keys.some(function(k){ return r.ing.indexOf(k)>=0; });
  });
  out.innerHTML = hit.map(function(r){
    return '<div class="recipe show"><h4>'+r.n+'</h4><div class="k">'+r.k+'</div></div>';
  }).join("") || '<div class="recipe show"><h4>没有完全匹配的食谱</h4><div class="k">试试少选一种食材，或换个组合再试。</div></div>';
};

// ===== 搜索功能 =====
document.getElementById("searchBtn").onclick = function(){
  var searchTerm = document.getElementById("searchInput").value.toLowerCase();
  if(!searchTerm) {
    renderIngs();
    return;
  }
  
  var box = document.getElementById("ingList");
  var all = [];
  RECIPES.forEach(function(r){ r.ing.forEach(function(i){ if(all.indexOf(i)<0) all.push(i); }); });
  
  var filtered = all.filter(function(i){
    return i.toLowerCase().indexOf(searchTerm) >= 0;
  });
  
  box.innerHTML = filtered.map(function(i){
    return '<span class="chip'+(sel[i]?' on':'')+'" data-i="'+i+'">'+i+'</span>';
  }).join("") || '<div class="recipe show"><h4>没有找到匹配的食材</h4></div>';
};

document.getElementById("searchInput").addEventListener("keypress", function(e){
  if(e.key === "Enter") {
    document.getElementById("searchBtn").click();
  }
});

// ===== 热量计算 =====
var chosen = [];
function renderFoods(){
  var box = document.getElementById("foodList");
  box.innerHTML = FOODS.map(function(f){
    return '<span class="chip" data-f="'+f.n+'">'+f.n+' '+f.c+'千卡/100g</span>';
  }).join("");
}
// 使用事件委托优化chip点击事件
document.getElementById("foodList").addEventListener("click", function(e) {
  if(e.target.classList.contains("chip")) {
    document.getElementById("calInput").placeholder = e.target.getAttribute("data-f")+" · 输入克数";
  }
});
var total = 0;
document.getElementById("btnAdd").onclick = function(){
  var inp = document.getElementById("calInput");
  var w = parseFloat(inp.value);
  var ph = inp.placeholder;
  // 检查输入是否为空
  if(!inp.value.trim()) return;
  // 检查输入是否为有效数字
  if(isNaN(w)) return;
  if(!w || ph.indexOf("·")<0) return;
  var name = ph.split(" ·")[0];
  var f = FOODS.filter(function(x){return x.n===name;})[0];
  if(!f) return;
  
  // 检查是否已添加相同食物和相同重量
  var foodExists = chosen.some(function(item) {
    return item === name + " " + w + "g";
  });
  
  if(foodExists) {
    document.getElementById("calOut").textContent = "已添加相同食物和重量";
    document.getElementById("calOut").classList.add("calChange");
    setTimeout(function(){ document.getElementById("calOut").classList.remove("calChange"); }, 500);
    return;
  }
  
  total += Math.round(f.c * w / 100);
  chosen.push(name + " " + w + "g");
  document.getElementById("calOut").textContent = "已选 " + chosen.length + " 项 · 共 " + total + " 千卡";
  document.getElementById("calOut").classList.add("calChange");
  setTimeout(function(){ document.getElementById("calOut").classList.remove("calChange"); }, 500);
  inp.value = "";
};

// ===== 饮品 =====
function renderDrinks(){
  document.getElementById("drinkList").innerHTML = DRINKS.map(function(d){
    return '<div class="drink"><h4>'+d.n+'</h4><p>'+d.d+'</p></div>';
  }).join("");
}

// ===== Tab =====
document.querySelectorAll(".tab").forEach(function(t){
  t.onclick = function(){
    document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active");});
    t.classList.add("active");
    ["rec","cal","drink"].forEach(function(p){
      document.getElementById("p-"+p).style.display = p===t.getAttribute("data-p") ? "block":"none";
    });
  };
});

// 初始化
renderIngs(); renderFoods(); renderDrinks();
