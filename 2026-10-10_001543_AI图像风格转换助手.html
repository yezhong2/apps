<script>
  let uploadedImage = null;
  let transformedImage = null;

  function showStatus(elementId, message, isError = false) {
    const statusElement = document.getElementById(elementId);
    statusElement.textContent = message;
    statusElement.style.display = 'block';
    statusElement.style.backgroundColor = isError ? '#d32f2f' : '#388e3c';
    setTimeout(() => {
      statusElement.style.display = 'none';
    }, 3000);
  }

  function uploadImage() {
    const fileInput = document.getElementById('imageUpload');
    const file = fileInput.files[0];
    
    if (!file) {
      showStatus('uploadStatus', 'Please select an image file', true);
      return;
    }
    
    if (!file.type.match('image.*')) {
      showStatus('uploadStatus', 'Please select a valid image file', true);
      return;
    }
    
    const reader = new FileReader();
    reader.onload = function(e) {
      uploadedImage = e.target.result;
      document.getElementById('previewImage').src = uploadedImage;
      transformedImage = uploadedImage;
      showStatus('uploadStatus', 'Image uploaded successfully');
    };
    reader.onerror = function() {
      showStatus('uploadStatus', 'Error reading image file', true);
    };
    reader.readAsDataURL(file);
  }

  function applyStyle() {
    if (!uploadedImage) {
      showStatus('styleStatus', 'Please upload an image first', true);
      return;
    }
    
    const style = document.getElementById('styleSelect').value;
    const loadingElement = document.getElementById('styleLoading');
    loadingElement.style.display = 'block';
    
    try {
      window.__AIChannel.submit('style', { 'image': uploadedImage, 'style': style })
        .then(function(r) {
          if (r && r.text) {
            transformedImage = r.text;
            document.getElementById('previewImage').src = transformedImage;
            showStatus('styleStatus', 'Style applied successfully');
          } else {
            showStatus('styleStatus', 'Error: Invalid response from AI service', true);
          }
        })
        .catch(function(e) {
          console.error('Style application error:', e);
          showStatus('styleStatus', 'Error applying style: ' + e.message, true);
        })
        .finally(function() {
          loadingElement.style.display = 'none';
        });
    } catch (e) {
      console.error('Style application error:', e);
      showStatus('styleStatus', 'Error applying style: ' + e.message, true);
      loadingElement.style.display = 'none';
    }
  }

  function applyCustomStyle() {
    if (!uploadedImage) {
      showStatus('customStatus', 'Please upload an image first', true);
      return;
    }
    
    const customStyle = document.getElementById('customStyle').value.trim();
    if (!customStyle) {
      showStatus('customStatus', 'Please enter custom style parameters', true);
      return;
    }
    
    const loadingElement = document.getElementById('styleLoading');
    loadingElement.style.display = 'block';
    
    try {
      window.__AIChannel.submit('style', { 'image': uploadedImage, 'style': customStyle })
        .then(function(r) {
          if (r && r.text) {
            transformedImage = r.text;
            document.getElementById('previewImage').src = transformedImage;
            showStatus('customStatus', 'Custom style applied successfully');
          } else {
            showStatus('customStatus', 'Error: Invalid response from AI service', true);
          }
        })
        .catch(function(e) {
          console.error('Custom style application error:', e);
          showStatus('customStatus', 'Error applying custom style: ' + e.message, true);
        })
        .finally(function() {
          loadingElement.style.display = 'none';
        });
    } catch (e) {
      console.error('Custom style application error:', e);
      showStatus('customStatus', 'Error applying custom style: ' + e.message, true);
      loadingElement.style.display = 'none';
    }
  }

  function saveDownloadImage() {
    if (!transformedImage) {
      showStatus('downloadStatus', 'No image to download. Please upload and transform an image first', true);
      return;
    }
    
    try {
      const link = document.createElement('a');
      link.href = transformedImage;
      link.download = 'transformed-image.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showStatus('downloadStatus', 'Image downloaded successfully');
    } catch (e) {
      console.error('Download error:', e);
      showStatus('downloadStatus', 'Error downloading image: ' + e.message, true);
    }
  }
</script>
