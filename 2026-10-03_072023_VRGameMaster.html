        /* Link Checker */

        /* Notification */
        .notification {

            bottom: 20px;

            padding: 15px 20px;

        }
        
        .notification.show {
            transform: translateY(0);
            opacity: 1;

        .notification.success {
            background-color: #2e7d32;

        .notification.error {
            background-color: #d32f2f;

        .notification.info {

        /* Loading Spinner */
        .spinner {

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 28px;
            }

                display: none;
            }
            
            .search-input {
                flex-direction: column;
            }
            
            .result-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .result-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo">VRGameMaster</div>
                <div class="nav-links">
                    <a href="#home">Home</a>

                    <a href="#reviews">Reviews</a>
                    <a href="#about">About</a>
                </div>
            </div>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>Your Ultimate VR Gaming Assistant</h1>
            <p>Discover, compare, and review VR games across all platforms and devices</p>
        </div>
    </section>

    <!-- Search Section -->
    <section class="search-section">
        <div class="container">
            <div class="search-tabs">
                <button class="tab-button active" data-tab="game">Find Games</button>
                <button class="tab-button" data-tab="platform">Platform Games</button>
                <button class="tab-button" data-tab="device">Device Compatibility</button>
                <button class="tab-button" data-tab="review">Game Reviews</button>
                <button class="tab-button" data-tab="link">Check Download Link</button>
            </div>
            
            <div class="search-input">
                <input type="text" id="searchInput" placeholder="Enter game name, platform, device, review, or download link...">
                <button class="search-button" id="searchButton">Search</button>
            </div>
        </div>

    <!-- Results Section -->
    <section class="results-section">
        <div class="container">
            <div id="resultsContainer">
                <p style="text-align: center; color: #999999;">Enter a search term to find VR games</p>
            </div>
        </div>
    </section>

    <!-- Reviews Section -->
    <section class="reviews-section" id="reviewsSection" style="display: none;">
        <div class="container">
            <h2>Community Reviews</h2>
            <div id="reviewsContainer">
                <!-- Reviews will be populated here -->
            </div>
            
            <div class="add-review-form">
                <h3>Add Your Review</h3>
                <form id="reviewForm">
                    <div class="form-group">
                        <label for="reviewerName">Your Name</label>
                        <input type="text" id="reviewerName" required>
                    </div>
                    <div class="form-group">
                        <label>Rating</label>
                        <div class="rating-input" id="ratingInput">
                            <span class="star-input" data-rating="1">★</span>
                            <span class="star-input" data-rating="2">★</span>
                            <span class="star-input" data-rating="3">★</span>
                            <span class="star-input" data-rating="4">★</span>
                            <span class="star-input" data-rating="5">★</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="reviewText">Your Review</label>
                        <textarea id="reviewText" required></textarea>
                    </div>
                    <button type="submit" class="submit-button">Submit Review</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script>
        // Sample data for demonstration
        const sampleGames = [
            {
                id: 1,
                title: "Half-Life: Alyx",
                platforms: ["PC VR", "Valve Index"],
                rating: 4.8,
                description: "A groundbreaking VR game set in the Half-Life universe.",
                compatibleDevices: ["Valve Index", "Oculus Rift S", "HTC Vive", "Windows Mixed Reality"],
                reviews: [
                    { reviewer: "Alex Johnson", rating: 5, text: "Absolutely stunning graphics and gameplay!", date: "2026-05-10" },
                    { reviewer: "Sam Wilson", rating: 4, text: "Great game but can be challenging at times.", date: "2026-05-08" }
                ]
            },
            {
                id: 2,
                title: "Beat Saber",
                platforms: ["PC VR", "PlayStation VR", "Quest"],
                rating: 4.7,
                description: "Rhythm game where you slash blocks with lightsabers.",
                compatibleDevices: ["Oculus Quest", "Oculus Rift S", "HTC Vive", "Valve Index", "Windows Mixed Reality"],
                reviews: [
                    { reviewer: "Taylor Kim", rating: 5, text: "Best VR game ever! So much fun!", date: "2026-05-12" },
                    { reviewer: "Jordan Lee", rating: 4, text: "Great workout and very addictive.", date: "2026-05-09" }
                ]
            },
            {
                id: 3,
                title: "Superhot VR",
                platforms: ["PC VR", "PlayStation VR", "Quest"],
                rating: 4.5,
                description: "Time moves only when you move in this stylish action game.",
                compatibleDevices: ["Oculus Rift S", "HTC Vive", "Valve Index", "Windows Mixed Reality", "PlayStation VR"],
                reviews: [
                    { reviewer: "Casey Smith", rating: 4, text: "Unique concept and great gameplay.", date: "2026-05-11" },
                    { reviewer: "Morgan Brown", rating: 5, text: "Mind-blowing VR experience!", date: "2026-05-07" }
                ]
            }
        ];

        const samplePlatforms = [
            { name: "Oculus Quest", games: ["Beat Saber", "Superhot VR", "Moss"] },
            { name: "SteamVR", games: ["Half-Life: Alyx", "Skyrim VR", "Boneworks"] },
            { name: "PlayStation VR", games: "Beat Saber, Superhot VR, Blood and Truth" },
            { name: "Valve Index", games: "Half-Life: Alyx, Boneworks, The Walking Dead Saints & Sinners" }
        ];

        const sampleDevices = [
            { name: "Oculus Quest 2", compatibleGames: ["Beat Saber", "Superhot VR", "Moss"] },
            { name: "Valve Index", compatibleGames: ["Half-Life: Alyx", "Boneworks"] },
            { name: "HTC Vive", compatibleGames: ["Half-Life: Alyx", "Skyrim VR", "Superhot VR"] },
            { name: "PlayStation VR", compatibleGames: ["Beat Saber", "Blood and Truth", "Superhot VR"] }
        ];

        // Initialize variables
        let currentTab = 'game';
        let selectedRating = 0;

        // DOM elements
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsContainer = document.getElementById('resultsContainer');
        const reviewsSection = document.getElementById('reviewsSection');
        const reviewsContainer = document.getElementById('reviewsContainer');
        const reviewForm = document.getElementById('reviewForm');
        const notification = document.getElementById('notification');
        const ratingInput = document.getElementById('ratingInput');

        // Tab functionality
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', function() {
                document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                currentTab = this.dataset.tab;
                reviewsSection.style.display = 'none';
                
                if (currentTab === 'review') {
                    reviewsSection.style.display = 'block';
                }
            });
        });

        // Search functionality
        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        function performSearch() {
            const searchTerm = searchInput.value.trim();
            if (!searchTerm) {
                showNotification('Please enter a search term', 'error');
                return;
            }

            resultsContainer.innerHTML = '<div class="spinner"></div>';

            // Simulate API call delay
            setTimeout(() => {
                switch(currentTab) {
                    case 'game':
                        searchGames(searchTerm);
                        break;
                    case 'platform':
                        searchByPlatform(searchTerm);
                        break;
                    case 'device':
                        checkDeviceCompatibility(searchTerm);
                        break;
                    case 'review':
                        searchReviews(searchTerm);
                        break;
                    case 'link':
                        checkDownloadLink(searchTerm);
                        break;
                }
            }, 800);
        }

        function searchGames(searchTerm) {
            const results = sampleGames.filter(game => 
                game.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                game.description.toLowerCase().includes(searchTerm.toLowerCase())
            );

            displayResults(results, 'games');
        }

        function searchByPlatform(searchTerm) {
            const platform = samplePlatforms.find(p => 
                p.name.toLowerCase().includes(searchTerm.toLowerCase())
            );

            if (platform) {
                const results = sampleGames.filter(game => 
                    platform.games.some(g => game.title.toLowerCase().includes(g.toLowerCase()))
                );
                displayResults(results, 'platform');
            } else {
                resultsContainer.innerHTML = `<p>No platform found matching "${searchTerm}"</p>`;
            }
        }

        function checkDeviceCompatibility(searchTerm) {
            const device = sampleDevices.find(d => 
                d.name.toLowerCase().includes(searchTerm.toLowerCase())
            );

            if (device) {
                const results = sampleGames.filter(game => 
                    device.compatibleGames.some(g => game.title.toLowerCase().includes(g.toLowerCase()))
                );
                displayResults(results, 'device', device.name);
            } else {
                resultsContainer.innerHTML = `<p>No device found matching "${searchTerm}"</p>`;
            }
        }

        function searchReviews(searchTerm) {
            const results = sampleGames.filter(game => 
                game.reviews.some(review => 
                    review.text.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    review.reviewer.toLowerCase().includes(searchTerm.toLowerCase())
                )
            );

            displayResults(results, 'reviews');
        }

        function checkDownloadLink(searchTerm) {
            // Simulate link validation
            const isValid = searchTerm.includes('http') || searchTerm.includes('https');
            
            resultsContainer.innerHTML = `
                <div class="check-result ${isValid ? 'valid' : 'invalid'}">
                    <h3>Link Status: ${isValid ? 'Valid' : 'Invalid'}</h3>
                    <p>${isValid ? 'The download link appears to be valid.' : 'The download link is invalid or inaccessible.'}</p>
                </div>
            `;
        }

        function displayResults(results, type, deviceName = '') {
            if (results.length === 0) {
                resultsContainer.innerHTML = `<p>No results found for your search.</p>`;
                return;
            }

            let html = '';
            
            results.forEach(game => {
                const compatibilityClass = deviceName ? 
                    (game.compatibleDevices.includes(deviceName) ? 'compatible' : 
                     game.compatibleDevices.some(d => d.toLowerCase().includes(deviceName.toLowerCase())) ? 'partial' : 'incompatible') : '';
                
                const compatibilityText = deviceName ? 
                    (game.compatibleDevices.includes(deviceName) ? 'Fully Compatible' : 
                     game.compatibleDevices.some(d => d.toLowerCase().includes(deviceName.toLowerCase())) ? 'Partially Compatible' : 'Not Compatible') : '';
                
                html += `
                    <div class="result-card">
                        <div class="result-header">
                            <h3 class="result-title">${game.title}</h3>
                            <div class="result-rating">
                                <span class="stars">${'★'.repeat(Math.floor(game.rating))}${'☆'.repeat(5 - Math.floor(game.rating))}</span>
                                <span>${game.rating}</span>
                            </div>
                        </div>
                        <div class="result-platform">
                            ${game.platforms.map(p => `<span class="platform-tag">${p}</span>`).join('')}
                        </div>
                        <p class="result-description">${game.description}</p>
                        <div class="result-footer">
                            ${deviceName ? `<div class="compatibility ${compatibilityClass}">${compatibilityText}</div>` : ''}
                            <button class="submit-button" onclick="showReviews(${game.id})">View Reviews</button>
                        </div>
                    </div>
                `;
            });

            resultsContainer.innerHTML = html;
        }

        function showReviews(gameId) {
            const game = sampleGames.find(g => g.id === gameId);
            if (!game) return;

            reviewsContainer.innerHTML = '';
            
            game.reviews.forEach(review => {
                reviewsContainer.innerHTML += `
                    <div class="review-card">
                        <div class="review-header">
                            <span class="reviewer">${review.reviewer}</span>
                            <span class="review-date">${review.date}</span>
                        </div>
                        <div class="review-rating">
                            <span class="stars">${'★'.repeat(review.rating)}${'☆'.repeat(5 - review.rating)}</span>
                        </div>
                        <p class="review-text">${review.text}</p>
                    </div>
                `;
            });

            reviewsSection.style.display = 'block';
            reviewsSection.scrollIntoView({ behavior: 'smooth' });
        }

        // Rating functionality
        document.querySelectorAll('.star-input').forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = parseInt(this.dataset.rating);
                updateStars();
            });
        });

        function updateStars() {
            document.querySelectorAll('.star-input').forEach((star, index) => {
                if (index < selectedRating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        // Review form submission
        reviewForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (selectedRating === 0) {
                showNotification('Please select a rating', 'error');
                return;
            }

            const reviewerName = document.getElementById('reviewerName').value;
            const reviewText = document.getElementById('reviewText').value;
            
            // Add review to first game as demo
            if (sampleGames.length > 0) {
                sampleGames[0].reviews.push({
                    reviewer: reviewerName,
                    rating: selectedRating,
                    text: reviewText,
                    date: new Date().toISOString().split('T')[0]
                });
                
                showNotification('Review submitted successfully!', 'success');
                reviewForm.reset();
                selectedRating = 0;
                updateStars();
                
                // Refresh reviews display
                showReviews(sampleGames[0].id);
            }
        });

        // Notification function
        function showNotification(message, type) {
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
