    <script>
        // 确保所有DOM元素在DOM加载完成后引用
        document.addEventListener('DOMContentLoaded', function() {
            const generateBtn = document.getElementById('generate-btn');
            const resetBtn = document.getElementById('reset-btn');
            const exportCsvBtn = document.getElementById('export-csv-btn');
            const exportMidiBtn = document.getElementById('export-midi-btn');
            const exportJsonBtn = document.getElementById('export-json-btn');
            const textInput = document.getElementById('text-input');
            const songInput = document.getElementById('song-input');
            const modeSelect = document.getElementById('mode-select');
            const lengthInput = document.getElementById('length-input');
            const customInput = document.getElementById('custom-input');
            const rhythmDisplay = document.getElementById('rhythm-display');
            const exportButtons = document.getElementById('export-buttons');
            const notification = document.getElementById('notification');
            const modeIndicator = document.getElementById('mode-indicator');

            // Update mode indicator when mode changes
            modeSelect.addEventListener('change', function() {
                const mode = this.value;
                if (mode === 'auto') {
                    modeIndicator.textContent = 'Auto';
                    modeIndicator.className = 'mode-indicator';
                } else {
                    modeIndicator.textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
                    modeIndicator.className = 'mode-indicator mode-' + mode;
                }
            });

            // Smart mode detection
            function detectBestMode(text) {
                if (!text) return 'simple';
                
                const words = text.split(/\s+/);
                const wordCount = words.length;
                
                // Analyze text complexity
                const complexWords = words.filter(word => word.length > 6).length;
                const punctuationCount = (text.match(/[.,!?;:]/g) || []).length;
                
                // Calculate complexity score
                const complexityScore = (wordCount * 0.3) + (complexWords * 0.5) + (punctuationCount * 0.2);
                
                if (complexityScore < 10) {
                    return 'simple';
                } else if (complexityScore < 20) {
                    return 'medium';
                } else {
                    return 'complex';
                }
            }

            // Auto detect mode when text changes
            textInput.addEventListener('input', function() {
                if (modeSelect.value === 'auto') {
                    const detectedMode = detectBestMode(this.value);
                    modeSelect.value = detectedMode;
                    modeIndicator.textContent = detectedMode.charAt(0).toUpperCase() + detectedMode.slice(1);
                    modeIndicator.className = 'mode-indicator mode-' + detectedMode;
                }
            });

            generateBtn.addEventListener('click', function() {
                // 检查所有必需的DOM元素是否存在
                if (!textInput || !songInput || !modeSelect || !lengthInput || !customInput || !rhythmDisplay || !exportButtons) {
                    console.error('Required DOM elements not found');
                    showNotification('Error: Required elements missing', 'error');
                    return;
                }
                
                const text = textInput.value;
                const song = songInput.value;
                let mode = modeSelect.value;
                
                // Auto-detect mode if auto is selected
                if (mode === 'auto') {
                    mode = detectBestMode(text);
                }
                
                const length = lengthInput.value;
                const custom = customInput.value;
                
                if (!text && !song) {
                    showNotification('Please enter text or song name', 'error');
                    return;
                }
                
                // Show loading state
                generateBtn.innerHTML = 'Generating Rhythm <span class="loading"></span>';
                generateBtn.disabled = true;
                
                // Generate rhythm using AI
                generateRhythm(text, song, mode, length, custom)
                    .then(rhythm => {
                        rhythmDisplay.textContent = rhythm;
                        exportButtons.classList.add('active');
                        showNotification('Rhythm generated successfully!');
                    })
                    .catch(error => {
                        console.error('Error generating rhythm:', error);
                        showNotification('Error generating rhythm. Please try again.', 'error');
                    })
                    .finally(() => {
                        // Reset button state
                        generateBtn.innerHTML = 'Generate Rhythm';
                        generateBtn.disabled = false;
                    });
            });

            resetBtn.addEventListener('click', function() {
                // 检查所有必需的DOM元素是否存在
                if (!textInput || !songInput || !modeSelect || !lengthInput || !customInput || !rhythmDisplay || !exportButtons) {
                    console.error('Required DOM elements not found');
                    showNotification('Error: Required elements missing', 'error');
                    return;
                }
                
                textInput.value = '';
                songInput.value = '';
                modeSelect.value = 'simple';
                lengthInput.value = '8';
                customInput.value = '';
                rhythmDisplay.textContent = 'Your generated rhythm will appear here...';
                exportButtons.classList.remove('active');
                modeIndicator.textContent = 'Simple';
                modeIndicator.className = 'mode-indicator mode-simple';
            });

            exportCsvBtn.addEventListener('click', function() {
                if (!rhythmDisplay) {
                    showNotification('Error: Rhythm display not found', 'error');
                    return;
                }
                const rhythmData = rhythmDisplay.textContent;
                const csvContent = convertToCSV(rhythmData);
                downloadFile(csvContent, 'rhythm.csv', 'text/csv');
                showNotification('CSV file downloaded successfully!');
            });

            exportMidiBtn.addEventListener('click', function() {
                if (!rhythmDisplay) {
                    showNotification('Error: Rhythm display not found', 'error');
                    return;
                }
                const rhythmData = rhythmDisplay.textContent;
                const midiContent = convertToMIDI(rhythmData);
                downloadFile(midiContent, 'rhythm.mid', 'audio/midi');
                showNotification('MIDI file downloaded successfully!');
            });

            exportJsonBtn.addEventListener('click', function() {
                if (!rhythmDisplay) {
                    showNotification('Error: Rhythm display not found', 'error');
                    return;
                }
                const rhythmData = rhythmDisplay.textContent;
                const jsonContent = convertToJSON(rhythmData);
                downloadFile(jsonContent, 'rhythm.json', 'application/json');
                showNotification('JSON file downloaded successfully!');
            });

            function generateRhythm(text, song, mode, length, custom) {
                return new Promise((resolve, reject) => {
                    // Prepare the task for AI generation
                    const task = 'text'; // Using text task for rhythm generation
                    const input = {
                        text: text || song,
                        mode: mode,
                        length: parseInt(length) || 8,
                        custom: custom,
                        complexity: mode === 'simple' ? '简单' : mode === 'medium' ? '中等' : '复杂'
                    };
                    
                    // Check if AI channel is available
                    if (typeof window.__AIChannel !== 'undefined' && typeof window.__AIChannel.submit === 'function') {
                        // Submit to AI channel
                        window.__AIChannel.submit(task, input)
                            .then(response => {
                                // Process and format the AI response
                                let formattedRhythm = formatRhythmResponse(response, text, song, mode, length, custom);
                                resolve(formattedRhythm);
                            })
                            .catch(error => {
                                console.error('AI generation error:', error);
                                reject(error);
                            });
                    } else {
                        // Fallback to local generation if AI channel not available
                        console.warn('AI channel not available, using local generation');
                        let rhythm = generateLocalRhythm(text, song, mode, length, custom);
                        resolve(rhythm);
                    }
                });
            }
            
            function formatRhythmResponse(response, text, song, mode, length, custom) {
                // If response is already formatted, return it directly
                if (typeof response === 'string' && response.includes('Generated Rhythm')) {
                    return response;
                }
                
                // If response is an object, format it
                if (typeof response === 'object') {
                    let output = `Generated Rhythm for: ${song || text}\n`;
                    output += `Mode: ${mode}\n`;
                    output += `Length: ${length} bars\n`;
                    
                    if (custom) {
                        output += `Elements: ${custom}\n`;
                    }
                    
                    output += '='.repeat(30) + '\n';
                    
                    // Format the rhythm pattern
                    if (response.pattern && Array.isArray(response.pattern)) {
                        response.pattern.forEach((bar, index) => {
                            if (bar.element && bar.pattern) {
                                output += `[${bar.element}] ${bar.pattern}\n`;
                            }
                        });
                    } else {
                        // If pattern is not in expected format, use a fallback
                        output += generateFallbackPattern(mode, length, custom);
                    }
                    
                    return output;
                }
                
                // Default fallback
                return generateFallbackPattern(mode, length, custom);
            }
            
            function generateLocalRhythm(text, song, mode, length, custom) {
                // Parse custom elements if provided
                const customElements = custom ? custom.split(',').map(e => e.trim()) : [];
                
                // Basic rhythm patterns
                const simplePatterns = {
                    kick: '[x]   [x]   [x]   [x]',
                    snare: '    [x]       [x]',
                    hiHat: '[x][x][x][x][x][x][x][x]'
                };
                
                const mediumPatterns = {
                    kick: '[x] . [x] . [x] . [x]',
                    snare: '    [x] . [x] . [x] .',
                    hiHat: '[x][x][x][x][x][x][x][x]',
                    clap: '    [x]       [x]'
                };
                
                const complexPatterns = {
                    kick: '[x] . [x] . [x] . [x]',
                    snare: '    [x] . . [x] . .',
                    hiHat: '[x][x][x][x][x][x][x][x]',
                    clap: '    [x] . [x] . [x] .',
                    openHat: '    [x]       [x]'
                };
                
                // Determine which pattern to use
                let patterns;
                if (mode === 'simple') {
                    patterns = simplePatterns;
                } else if (mode === 'medium') {
                    patterns = mediumPatterns;
                } else {
                    patterns = complexPatterns;
                }
                const patternElements = customElements.length > 0 ? customElements : Object.keys(patterns);
                
                // Generate rhythm bars
                let rhythmBars = [];
                const barCount = parseInt(length) || 8;
                
                for (let i = 0; i < barCount; i++) {
                    let bar = '';
                    for (let element of patternElements) {
                        bar += patterns[element] || '';
                        bar += ' ';
                    }
                    rhythmBars.push(bar.trim());
                }
                
                // Create rhythm output
                let output = `Generated Rhythm for: ${song || text}\n`;
                output += `Mode: ${mode}\n`;
                output += `Length: ${barCount} bars\n`;
                output += `Elements: ${patternElements.join(', ')}\n`;
                output += '='.repeat(30) + '\n';
                output += rhythmBars.join('\n');
                
                return output;
            }
            
            function generateFallbackPattern(mode, length, custom) {
                const barCount = parseInt(length) || 8;
                let pattern = '';
                
                if (mode === 'simple') {
                    for (let i = 0; i < barCount; i++) {
                        pattern += `[x]   `;
                    }
                } else {
                    for (let i = 0; i < barCount; i++) {
                        pattern += `[x] . `;
                    }
                }
                
                return pattern.trim();
            }

            function convertToCSV(rhythmData) {
                if (!rhythmData) return '';
                const lines = rhythmData.split('\n');
                let csv = 'Element,Beat 1,Beat 2,Beat 3,Beat 4,Beat 5,Beat 6,Beat 7,Beat 8\n';
                
                // Extract elements and rhythm pattern
                const elements = [];
                const patterns = [];
                
                lines.forEach(line => {
                    if (line.includes('[') && line.includes(']')) {
                        const elementMatch = line.match(/^\[([^\]]+)\]/);
                        if (elementMatch) {
                            elements.push(elementMatch[1]);
                            patterns.push(line.replace(/^\[[^\]]+\]\s*/, ''));
                        }
                    }
                });
                
                // Create CSV rows
                elements.forEach((element, index) => {
                    const pattern = patterns[index] || '';
                    const beats = pattern.match(/\[x\]|\[.\]/g) || [];
                    const row = [element, ...beats];
                    csv += row.join(',') + '\n';
                });
                
                return csv;
            }

            function convertToMIDI(rhythmData) {
                if (!rhythmData) return '';
                // Simplified MIDI conversion
                // In a real implementation, this would use a proper MIDI library
                const midiHeader = 'MThd\x00\x00\x00\x06\x00\x00\x00\x01\x00\x80';
                const midiTrack = 'MTrk\x00\x00\x00\x00';
                
                // Extract rhythm patterns
                const lines = rhythmData.split('\n');
                let trackEvents = '';
                let currentTime = 0;
                
                lines.forEach(line => {
                    if (line.includes('[') && line.includes(']')) {
                        const beats = line.match(/\[x\]|\[.\]/g) || [];
                        beats.forEach((beat, index) => {
                            if (beat === '[x]') {
                                // Note on event
                                trackEvents += String.fromCharCode(currentTime >> 16, currentTime >> 8, currentTime);
                                trackEvents += '\x90\x3C\x7F';
                                
                                // Note off event
                                currentTime += 480; // Quarter note duration
                                trackEvents += String.fromCharCode(0);
                                trackEvents += '\x80\x3C\x00';
                            } else {
                                // Rest, just advance time
                                currentTime += 480;
                            }
                        });
                    }
                });
                
                const trackLength = new Uint8Array([trackEvents.length >> 16, trackEvents.length >> 8, trackEvents.length]);
                const trackHeader = 'MTrk' + String.fromCharCode(...trackLength);
                
                return midiHeader + trackHeader + trackEvents;
            }

            function convertToJSON(rhythmData) {
                if (!rhythmData) return '{}';
                const lines = rhythmData.split('\n');
                const output = {
                    title: lines[0].replace('Generated Rhythm for: ', ''),
                    mode: lines[1].replace('Mode: ', ''),
                    length: parseInt(lines[2].replace('Length: ', '').replace(' bars', '')),
                    elements: lines[3].replace('Elements: ', '').split(', '),
                    pattern: []
                };
                
                // Extract rhythm pattern
                for (let i = 5; i < lines.length; i++) {
                    if (lines[i].startsWith('=')) continue;
                    
                    const beatPattern = {
                        bar: i - 4,
                        elements: []
                    };
                    
                    const elementMatch = lines[i].match(/^\[([^\]]+)\]/);
                    if (elementMatch) {
                        beatPattern.element = elementMatch[1];
                        beatPattern.pattern = lines[i].replace(/^\[[^\]]+\]\s*/, '');
                        beatPattern.beats = beatPattern.pattern.match(/\[x\]|\[.\]/g) || [];
                        output.pattern.push(beatPattern);
                    }
                }
                
                return JSON.stringify(output, null, 2);
            }

            function downloadFile(content, filename, mimeType) {
                if (!content) return;
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            function showNotification(message, type = 'success') {
                if (!notification) {
                    console.error('Notification element not found');
                    return;
                }
                notification.textContent = message;
                notification.style.backgroundColor = type === 'error' ? '#f44336' : '#4CAF50';
                notification.style.display = 'block';
                
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 3000);
            }
