<body>
<div class="container">
  <h1>Energy Consumption Monitor Assistant</h1>
  <div class="form-group">
    <label for="deviceType">Device Type:</label>
    <input type="text" id="deviceType" placeholder="e.g., Television">
  </div>
  <div class="form-group">
    <label for="runTime">Run Time (hours):</label>

  </div>
  <button onclick="calculateEnergy()">Calculate Energy Consumption</button>

<script>
  function calculateEnergy() {
    var deviceType = document.getElementById('deviceType').value;
    var runTime = parseFloat(document.getElementById('runTime').value);
    var result = document.getElementById('result');
    if (!deviceType || isNaN(runTime)) {
      result.textContent = 'Please enter valid device type and run time.';
      return;
    }
    // Example calculation: Energy consumption = device power (in watts) * run time (in hours)
    var power = 0;
    switch (deviceType.toLowerCase()) {
      case 'television':
        power = 120; // watts
        break;
      case 'air conditioner':
        power = 1500; // watts
        break;
      case 'computer':
        power = 300; // watts
        break;
      default:
        result.textContent = 'Unknown device type.';
        return;
    }
    var energyConsumption = power * runTime;
    result.textContent = `The energy consumption of the ${deviceType} is ${energyConsumption.toFixed(2)} watts.`;
  }
</script>
