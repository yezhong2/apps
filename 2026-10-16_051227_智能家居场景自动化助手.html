<script>
  const saveSceneBtn = document.getElementById('saveScene');
  const sceneSetupSection = document.getElementById('sceneSetupSection');
  const remoteControlSection = document.getElementById('remoteControlSection');
  const statusMonitorSection = document.getElementById('statusMonitorSection');
  const sceneName = document.getElementById('sceneName');
  const startTime = document.getElementById('startTime');
  const endTime = document.getElementById('endTime');
  const deviceSelect = document.getElementById('deviceSelect');
  const command = document.getElementById('command');
  const statusDisplay = document.getElementById('statusDisplay');
  const sendCommandBtn = document.getElementById('sendCommand');
  const sceneSetupBtn = document.getElementById('sceneSetup');
  const remoteControlBtn = document.getElementById('remoteControl');
  const statusMonitorBtn = document.getElementById('statusMonitor');

  saveSceneBtn.onclick = function() {
    const scene = {
      name: sceneName.value,
      startTime: startTime.value,
      endTime: endTime.value
    };
    console.log('Scene saved:', scene);
    alert('Scene saved successfully!');
  };

  sendCommandBtn.onclick = function() {
    const device = deviceSelect.value;
    const cmd = command.value;
    console.log('Command sent to', device, ':', cmd);
    alert('Command sent successfully!');
  };

  sceneSetupBtn.onclick = function() {
    sceneSetupSection.style.display = 'block';
    remoteControlSection.style.display = 'none';
    statusMonitorSection.style.display = 'none';
  };

  remoteControlBtn.onclick = function() {
    sceneSetupSection.style.display = 'none';
    remoteControlSection.style.display = 'block';
    statusMonitorSection.style.display = 'none';
  };

  statusMonitorBtn.onclick = function() {
    sceneSetupSection.style.display = 'none';
    remoteControlSection.style.display = 'none';
    statusMonitorSection.style.display = 'block';
  };
</script>
