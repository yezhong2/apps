<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情绪模拟器 - 让AI读懂你的情绪世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
            padding: 20px;
            max-width: 100%;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .tagline {
            font-size: 16px;
            color: #a0a0a0;
        }
        
        .emotion-display {
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .emotion-icon {
            font-size: 60px;
            margin-bottom: 15px;
            display: block;
        }
        
        .emotion-text {
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        .emotion-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
            margin-bottom: 15px;
        }
        
        .emotion-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4ecdc4;
            cursor: pointer;
        }
        
        .emotion-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4ecdc4;
            cursor: pointer;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .btn {
            background-color: #2a2a2a;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            position: relative;
        }
        
        .btn:hover {
            background-color: #3a3a3a;
            transform: translateY(-2px);
        }
        
        .btn-primary {
            background-color: #4ecdc4;
        }
        
        .btn-primary:hover {
            background-color: #45b7b8;
        }
        
        .feature-list {
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .feature-list h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #4ecdc4;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .feature-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .feature-icon {
            margin-right: 10px;
            font-size: 18px;
        }
        
        .lock-icon {
            color: #ff6b6b;
            margin-left: auto;
            cursor: pointer;
        }
        
        .instructions {
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .instructions h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #4ecdc4;
        }
        
        .instructions p {
            margin-bottom: 10px;
            color: #d0d0d0;
        }
        
        .unlock-section {
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            transition: all 0.3s;
        }
        
        .unlock-section.hidden {
            display: none;
        }
        
        .price {
            font-size: 36px;
            font-weight: bold;
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .payment-image {
            display: block;
            margin: 0 auto 20px;
            max-width: 200px;
        }
        
        .payment-info {
            text-align: center;
            margin-bottom: 20px;
            color: #d0d0d0;
        }
        
        .code-input {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
        }
        
        .unlock-btn {
            width: 100%;
            background-color: #ff6b6b;
        }
        
        .unlock-btn:hover {
            background-color: #ff5252;
        }
        
        .activated-message {
            text-align: center;
            color: #4ecdc4;
            font-size: 14px;
        }
        
        .locked-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }
        
        .locked-overlay:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
        
        .lock-icon-overlay {
            font-size: 36px;
            color: #ff6b6b;
        }
        
        @media (max-width: 480px) {
            .logo {
                font-size: 24px;
            }
            
            .emotion-text {
                font-size: 20px;
            }
            
            .btn {
                font-size: 14px;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">情绪模拟器</div>
            <div class="tagline">AI模拟人类情绪，让沟通更自然</div>
        </header>
        
        <section class="emotion-display">
            <span class="emotion-icon" id="emotionIcon">😐</span>
            <div class="emotion-text" id="emotionText">平静</div>
            <input type="range" class="emotion-slider" id="emotionSlider" min="0" max="100" value="50">
            <div>情绪强度</div>
        </section>
        
        <div class="controls">
            <button class="btn" id="happyBtn">😊 开心</button>
            <button class="btn" id="sadBtn">😢 悲伤</button>
            <button class="btn" id="angryBtn">😠 愤怒</button>
            <button class="btn" id="surprisedBtn">😲 惊讶</button>
            <button class="btn btn-primary" id="generateBtn">🎯 生成情绪分析</button>
        </div>
        
        <div class="feature-list">
            <h2>功能列表</h2>
            <div class="feature-item">
                <span class="feature-icon">✅</span>
                <span>基础情绪识别</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">✅</span>
                <span>情绪强度调节</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">✅</span>
                <span>简单情绪分析</span>
            </div>
            <div class="feature-item" id="advancedFeature">
                <span class="feature-icon">🔒</span>
                <span>高级情绪分析（含微表情识别）</span>
                <span class="lock-icon" title="付费解锁">🔒</span>
            </div>
            <div class="feature-item" id="customFeature">
                <span class="feature-icon">🔒</span>
                <span>自定义情绪模型</span>
                <span class="lock-icon" title="付费解锁">🔒</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">✅</span>
                <span>情绪历史记录</span>
            </div>
            <div class="feature-item" id="reportFeature">
                <span class="feature-icon">🔒</span>
                <span>情绪健康报告</span>
                <span class="lock-icon" title="付费解锁">🔒</span>
            </div>
        </div>
        
        <div class="instructions">
            <h2>使用说明</h2>
            <p>1. 拖动情绪滑块调节情绪强度</p>
            <p>2. 点击情绪按钮快速切换情绪状态</p>
            <p>3. 点击"生成情绪分析"获取AI分析结果</p>
            <p>4. 高级功能需要解锁完整版</p>
        </div>
        
        <div class="emotion-result" id="emotionResult" style="background-color: #1e1e1e; border-radius: 15px; padding: 20px; margin-bottom: 30px; display: none;">
            <h2>情绪分析结果</h2>
            <p id="resultText"></p>
        </div>
        
        <div class="unlock-section" id="unlockSection">
            <div class="price">¥19.9</div>
            <img src="https://via.placeholder.com/200x100/333333/ffffff?text=收款码" alt="付款码" class="payment-image">
            <div class="payment-info">
                付款后截图发微信 wxid_mztr7tpuejg212 领取激活码
            </div>
            <input type="text" class="code-input" id="codeInput" placeholder="激活码格式：如 658839-1521">
            <button class="btn unlock-btn" id="unlockBtn">立即解锁</button>
        </div>
        
        <script>
            // 检查解锁状态
            if (localStorage.getItem("unlocked") === "1") {
                document.getElementById("unlockSection").classList.add("hidden");
                document.getElementById("unlockSection").innerHTML = '<div class="activated-message">✅ 完整版已激活</div>';
                
                // 移除锁定功能上的锁标记
                const lockedElements = document.querySelectorAll('.lock-icon');
                lockedElements.forEach(el => {
                    el.style.display = 'none';
                });
                
                // 解锁功能
                document.getElementById("advancedFeature").querySelector('span').classList.remove('🔒');
                document.getElementById("advancedFeature").querySelector('span').classList.add('✅');
                document.getElementById("customFeature").querySelector('span').classList.remove('🔒');
                document.getElementById("customFeature").querySelector('span').classList.add('✅');
                document.getElementById("reportFeature").querySelector('span').classList.remove('🔒');
                document.getElementById("reportFeature").querySelector('span').classList.add('✅');
            }
            
            // 情绪数据
            const emotions = [
                { name: '极度悲伤', icon: '😭', range: [0, 20] },
                { name: '悲伤', icon: '😢', range: [20, 40] },
                { name: '平静', icon: '😐', range: [40, 60] },
                { name: '开心', icon: '😊', range: [60, 80] },
                { name: '极度开心', icon: '😄', range: [80, 100] }
            ];
            
            // DOM元素
            const emotionIcon = document.getElementById('emotionIcon');
            const emotionText = document.getElementById('emotionText');
            const emotionSlider = document.getElementById('emotionSlider');
            const emotionResult = document.getElementById('emotionResult');
            const resultText = document.getElementById('resultText');
            
            // 更新情绪显示
            function updateEmotion(value) {
                const emotion = emotions.find(e => value >= e.range[0] && value < e.range[1]);
                if (emotion) {
                    emotionIcon.textContent = emotion.icon;
                    emotionText.textContent = emotion.name;
                }
            }
            
            // 滑块变化事件
            emotionSlider.addEventListener('input', (e) => {
                updateEmotion(parseInt(e.target.value));
            });
            
            // 情绪按钮事件
            document.getElementById('happyBtn').addEventListener('click', () => {
                emotionSlider.value = 70;
                updateEmotion(70);
            });
            
            document.getElementById('sadBtn').addEventListener('click', () => {
                emotionSlider.value = 30;
                updateEmotion(30);
            });
            
            document.getElementById('angryBtn').addEventListener('click', () => {
                emotionSlider.value = 25;
                emotionIcon.textContent = '😠';
                emotionText.textContent = '愤怒';
            });
            
            document.getElementById('surprisedBtn').addEventListener('click', () => {
                emotionSlider.value = 55;
                emotionIcon.textContent = '😲';
                emotionText.textContent = '惊讶';
            });
            
            // 生成分析结果
            document.getElementById('generateBtn').addEventListener('click', () => {
                const value = parseInt(emotionSlider.value);
                emotionResult.style.display = 'block';
                
                if (localStorage.getItem("unlocked") === "1") {
                    // 完整版分析
                    if (value < 30) {
                        resultText.innerHTML = `
                            <p><strong>基础分析：</strong>当前处于较低情绪状态</p>
                            <p><strong>微表情分析：</strong>检测到嘴角轻微下垂，眉头微皱，表明可能存在轻度压力</p>
                            <p><strong>建议：</strong>尝试进行深呼吸练习，或与朋友分享您的感受</p>
                            <p><strong>情绪健康评分：</strong>65/100</p>
                        `;
                    } else if (value < 70) {
                        resultText.innerHTML = `
                            <p><strong>基础分析：</strong>情绪处于平稳状态</p>
                            <p><strong>微表情分析：</strong>面部表情自然，无明显情绪波动</p>
                            <p><strong>建议：</strong>保持当前状态，可以尝试一些轻松的活动</p>
                            <p><strong>情绪健康评分：</strong>80/100</p>
                        `;
                    } else {
                        resultText.innerHTML = `
                            <p><strong>基础分析：</strong>情绪处于积极状态</p>
                            <p><strong>微表情分析：</strong>检测到眼角皱纹，表明真实微笑，情绪状态良好</p>
                            <p><strong>建议：</strong>继续保持积极心态，可以尝试分享您的快乐</p>
                            <p><strong>情绪健康评分：</strong>92/100</p>
                        `;
                    }
                } else {
                    // 基础版分析
                    if (value < 30) {
                        resultText.innerHTML = `
                            <p><strong>基础分析：</strong>当前处于较低情绪状态</p>
                            <p><strong>建议：</strong>尝试进行深呼吸练习，或与朋友分享您的感受</p>
                        `;
                    } else if (value < 70) {
                        resultText.innerHTML = `
                            <p><strong>基础分析：</strong>情绪处于平稳状态</p>
                            <p><strong>建议：</strong>保持当前状态，可以尝试一些轻松的活动</p>
                        `;
                    } else {
                        resultText.innerHTML = `
                            <p><strong>基础分析：</strong>情绪处于积极状态</p>
                            <p><strong>建议：</strong>继续保持积极心态，可以尝试分享您的快乐</p>
                        `;
                    }
                }
                
                // 滚动到结果区域
                emotionResult.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
            
            // 锁定功能提示
            document.querySelectorAll('.lock-icon').forEach(icon => {
                icon.addEventListener('click', () => {
                    alert('付费解锁后可使用此功能');
                });
            });
            
            // 激活码验证函数
            function checkCode(code){
                var m=String(code).match(/^(\d{6})-(\d{4})$/);
                if(!m)return false;
                var s=0;
                for(var i=0;i<6;i++)s+=parseInt(m[1][i]);
                var e=("0000"+((s*s)%10000)).slice(-4);
                return m[2]===e;
            }
            
            // 解锁按钮
            document.getElementById('unlockBtn').addEventListener('click', function(){
                var c=document.getElementById("codeInput").value.trim();
                if(checkCode(c)){
                    localStorage.setItem("unlocked","1");
                    alert("激活成功！完整版已解锁");
                    location.reload();
                }else{
                    alert("激活码无效，请核对后重试");
                }
            });
        </script>
    </div>
</body>
</html>
